<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="小3〜中1の算数プリント（計算・図形・文章題）をA4一枚ぶん作って印刷できるページ。日本語／English、学年・単元ミックス対応。">
<title>算数プリントメーカー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" media="print"
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --desk:#EDF0F3; --desk2:#E2E7EC; --card:#FFFFFF; --line:#CFD8E1;
  --ink:#22456B; --ink2:#5B6C7E; --accent:#22456B; --accent-soft:#E4EBF3;
  --red:#D14338; --focus:#2F7FD1;
  --shadow:0 1px 2px rgba(23,42,64,.10),0 8px 24px rgba(23,42,64,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#151A20; --desk2:#1B222A; --card:#1E262F; --line:#313D49;
    --ink:#DCE6F0; --ink2:#9AAABA; --accent:#8FB6DE; --accent-soft:#25313D;
    --red:#F08076; --focus:#7FB4E8;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --desk:#151A20; --desk2:#1B222A; --card:#1E262F; --line:#313D49;
  --ink:#DCE6F0; --ink2:#9AAABA; --accent:#8FB6DE; --accent-soft:#25313D;
  --red:#F08076; --focus:#7FB4E8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--desk); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:14px; line-height:1.7; -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- 画面の骨格 ---------- */
.app{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:100vh}
.panel{
  background:var(--card);border-right:1px solid var(--line);
  padding:20px 20px 28px;display:flex;flex-direction:column;gap:16px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.brand h1{
  margin:0;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  font-size:19px;font-weight:700;letter-spacing:.02em;text-wrap:balance;
}
.brand .sz{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink2);
  border:1px solid var(--line);border-radius:4px;padding:0 5px}
.brand a.go{margin-left:auto;font-size:12px;color:var(--ink2);text-decoration:none;
  border:1.5px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap}
.brand a.go:hover{border-color:var(--accent);color:var(--ink)}

.grp{display:flex;flex-direction:column;gap:8px}
.grp>.lb{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--ink2);
  display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp>.lb em{font-style:normal;font-weight:400;letter-spacing:0;font-size:11px}
.grp[hidden]{display:none}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.g5{grid-template-columns:repeat(5,1fr);gap:5px}
.seg.g2{grid-template-columns:repeat(2,1fr)}
.seg button{
  background:transparent;border:1.5px solid var(--line);border-radius:9px;
  padding:9px 4px;cursor:pointer;font-size:13px;font-weight:500;line-height:1.3;
  transition:border-color .12s,background .12s;
}
.seg.g5 button{padding:8px 0;font-size:13.5px;font-weight:700}
.seg button small{display:block;font-size:10px;color:var(--ink2);font-weight:400}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.seg button[aria-pressed="true"] small{color:var(--ink)}
.seg button:hover{border-color:var(--accent)}
.seg button:disabled{opacity:.35;cursor:not-allowed}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{
  border:1.5px solid var(--line);background:transparent;border-radius:999px;
  padding:5px 12px;font-size:12.5px;cursor:pointer;line-height:1.5;text-align:left;
  transition:border-color .12s,background .12s;
}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.chips button:hover{border-color:var(--accent)}
.chips button.all{border-style:dashed;font-weight:700;color:var(--ink2)}
.lb .mini{border:1.5px solid var(--line);background:transparent;border-radius:999px;
  padding:1px 10px;font-size:11px;font-weight:700;color:var(--ink2);cursor:pointer;letter-spacing:0}
.lb .mini[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chips button i{font-style:normal;opacity:.6;font-size:11px;margin-right:4px}
.units{max-height:250px;overflow-y:auto;padding:2px 1px}

.ops{display:flex;gap:6px}
.ops button{
  flex:1 1 0;background:transparent;border:1.5px solid var(--line);border-radius:9px;
  padding:7px 0;cursor:pointer;font-size:20px;line-height:1.2;
  font-family:"Zen Maru Gothic",sans-serif;transition:border-color .12s,background .12s;
}
.ops button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ops button:hover{border-color:var(--accent)}
.ops button:disabled{opacity:.3;cursor:not-allowed}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink2)}
label.f select,label.f input[type="text"]{
  background:var(--desk2);border:1.5px solid var(--line);border-radius:8px;
  padding:7px 8px;font-size:13.5px;color:var(--ink);width:100%;
}
label.c{display:flex;gap:9px;align-items:flex-start;font-size:13px;cursor:pointer}
label.c input{margin-top:4px;accent-color:var(--accent);width:15px;height:15px;flex:0 0 auto}
label.c span small{display:block;font-size:11px;color:var(--ink2);line-height:1.5}
.radios{display:flex;flex-direction:column;gap:6px}

.acts{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:6px}
.acts .qrhelp{margin:2px 0 0;font-size:11.5px;line-height:1.6;color:var(--ink2)}
.acts button{
  border-radius:10px;padding:11px 12px;cursor:pointer;font-size:14px;font-weight:700;
  border:1.5px solid var(--accent);transition:transform .08s;
}
.acts button:active{transform:translateY(1px)}
.btn-print{background:var(--accent);color:var(--card)}
.btn-new{background:transparent;color:var(--accent)}
.acts .no{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:11.5px;color:var(--ink2);padding-top:2px;
}
.acts .no b{font-family:"Zen Maru Gothic",sans-serif;font-size:15px;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:.06em}
.warn{font-size:11.5px;color:var(--red);line-height:1.55;margin:0}
.warn[hidden]{display:none}
.warn a{color:inherit}
.warn.soft{color:var(--ink2)}
.warn.soft button{border-color:var(--line);color:var(--ink2)}
.warn button{margin-top:6px;border:1.5px solid var(--red);background:transparent;color:var(--red);
  border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}

/* ---------- 用紙 ---------- */
.stage{padding:26px 24px 60px;display:flex;flex-direction:column;align-items:center;gap:26px}
.wrap{height:calc(297mm * var(--s));width:calc(210mm * var(--s))}
.paper{
  width:210mm;height:297mm;background:#fff;color:#1B3A5C;
  padding:14mm 15mm 12mm;box-shadow:var(--shadow);
  transform:scale(var(--s));transform-origin:top left;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
.paper.en{font-family:"Zen Maru Gothic","Trebuchet MS",-apple-system,sans-serif}
.paper .head{display:flex;align-items:flex-end;gap:5mm;border-bottom:1.4pt solid #1B3A5C;padding-bottom:2.5mm}
.paper .head .t{flex:1 1 auto;min-width:0;overflow:hidden}
.paper .head .qr{flex:0 0 auto;background:#fff;padding:1.5mm;box-sizing:content-box}
.paper .head .qr svg{display:block;width:100%;height:100%}
.paper .head h2{margin:0;font-size:6.4mm;font-weight:700;line-height:1.25;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper .head .tag{font-size:3mm;color:#5A7391;letter-spacing:.05em;margin-top:.5mm;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 名まえ・日づけ・点数は わき役。小さく して 題の 下に 置く */
.paper .fields{display:flex;gap:5mm;margin-top:1.8mm;font-size:2.9mm;color:#8C9EB2}
.paper .fields .fl{display:flex;align-items:flex-end;gap:1.2mm;min-width:0}
.paper .fields .fl i{font-style:normal;white-space:nowrap}
.paper .fields .fl u{display:inline-block;text-decoration:none;border-bottom:.7pt solid #7A8FA6;height:5mm}
.paper .fields .nm u{width:30mm}
.paper .fields .dt u{width:18mm}
.paper .body{flex:1 1 auto;min-height:0;padding-top:6mm}
.paper .body.center{display:flex;align-items:center;justify-content:center}
.paper .foot{
  flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:4mm;
  font-size:2.8mm;color:#8C9EB2;border-top:.6pt solid #C6D3E0;padding-top:1.6mm;margin-top:3mm;
}
.paper .foot .qrnote{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* こたえは 紙には 出さない（場所だけ とっておく）。QR から 見る。 */
.v{color:#D14338;font-weight:700}
.paper .v{visibility:hidden;-webkit-user-select:none;user-select:none}

/* 分数 */
.fr{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  vertical-align:middle;line-height:1.12;font-size:.72em}
.fr b{font-weight:inherit;padding:0 .8mm}
.fr i{font-style:normal;border-top:.9pt solid currentColor;padding:0 .8mm}
.mx{display:inline-flex;align-items:center;gap:.6mm}

/* よこ式（計算だけのプリント） */
.yoko{list-style:none;margin:0;padding:0;display:grid;gap:5mm 8mm;counter-reset:q}
.yoko.c1{grid-template-columns:1fr}
.yoko.c2{grid-template-columns:1fr 1fr}
.yoko.c3{grid-template-columns:repeat(3,1fr)}
.yoko li{
  counter-increment:q;display:flex;align-items:center;gap:2mm;min-width:0;
  font-size:5.2mm;line-height:1.45;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.yoko.c3 li{font-size:4.8mm}
.yoko li::before{
  content:"(" counter(q) ")";font-size:3.4mm;color:#7A8FA6;
  flex:0 0 8mm;text-align:right;font-weight:500;
}
.yoko .ex{flex:0 0 auto;display:inline-flex;align-items:center;gap:1.2mm}
.yoko li.long{white-space:normal;align-items:flex-end}
.yoko li.long .ex{display:block;flex:1 1 auto;min-width:0;line-height:1.5}
.yoko li.long .sl{flex:0 0 22mm}
.yoko .eqs{flex:0 0 auto;padding-left:3mm}
.yoko .sl{flex:1 1 auto;border-bottom:.9pt solid #1B3A5C;min-width:13mm;
  height:7mm;display:flex;align-items:center;justify-content:center;padding-bottom:.5mm}
.yoko .sl .v{font-size:4.8mm}

/* まとまり型（図形・文章題・ミックス） */
.items{list-style:none;margin:0;padding:0;display:grid;gap:5mm 7mm;counter-reset:q}
.items.c1{grid-template-columns:1fr}
.items.c2{grid-template-columns:1fr 1fr}
.items.c3{grid-template-columns:1fr 1fr 1fr}
.items li{counter-increment:q;display:flex;gap:2mm;align-items:flex-start;min-width:0}
.items li::before{
  content:"(" counter(q) ")";font-size:3.4mm;color:#7A8FA6;
  flex:0 0 8mm;text-align:right;font-weight:500;padding-top:.8mm;
}
.items .bd{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1.8mm}
.items .qt{font-size:4mm;line-height:1.65;line-break:strict;overflow-wrap:break-word}
.items.c1 .qt{font-size:4.2mm}
.items .withfig{display:flex;gap:4mm;align-items:center}
.items .withfig .qt{flex:1 1 auto;min-width:0}
.items .fig{flex:0 0 auto}
.items .fig svg{display:block;width:34mm;height:auto;color:#1B3A5C}
.items.c1 .fig svg{width:42mm}
.items .calcline{font-size:5mm;line-height:1.4;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:2mm;white-space:nowrap;min-width:0}
.items .calcline.long{white-space:normal;font-size:4.2mm;line-height:1.6;display:block}
.items .calcline .ex{display:inline-flex;align-items:center;gap:1.2mm}
.items .aline{display:flex;align-items:flex-end;gap:2mm;font-size:3.4mm;color:#5A7391}
.items .aline b{font-weight:500;flex:0 0 auto}
.items .aline u{
  flex:1 1 auto;text-decoration:none;border-bottom:.9pt solid #1B3A5C;height:6.5mm;
  display:flex;align-items:center;justify-content:center;min-width:16mm;
}
.items .aline u .v{font-size:4.4mm;color:#D14338}

/* ひっ算 */
.hissan{display:grid;gap:5mm;grid-template-columns:repeat(var(--hc,3),1fr);counter-reset:q}
.hissan .cell{
  counter-increment:q;border:.8pt solid #C6D3E0;border-radius:1.5mm;
  padding:2.5mm 3mm 3mm;display:flex;flex-direction:column;
  min-width:0;overflow:hidden;                 /* 列に 入りきらない ときも 紙から 出さない */
}
.hissan .cell::before{content:"(" counter(q) ")";font-size:3.2mm;color:#7A8FA6;line-height:1}
.hissan .calc{margin:1.5mm auto 0;font-size:6mm;line-height:7mm;font-variant-numeric:tabular-nums;
  flex:1 1 auto;display:flex;flex-direction:column}
.hissan .row{display:flex;justify-content:flex-end;align-items:center;height:7mm}
.hissan .row .op{width:7mm;text-align:center;font-size:5.6mm}
.hissan .d{width:7mm;text-align:center}
.hissan .dot{width:3mm;text-align:center}
.hissan .ansarea{
  border-top:1.1pt solid #1B3A5C;height:7mm;flex:1 1 auto;
  background-image:linear-gradient(#EDF3F9 .3pt,transparent .3pt),
                   linear-gradient(90deg,#EDF3F9 .3pt,transparent .3pt);
  background-size:7mm 7mm;background-position:7mm 0;
}
.hissan .ansarea.x2{height:14mm}
.hissan .ansarea.x3{height:21mm}
.hissan .ansarea.x4{height:28mm}
.hissan .ansarea.x5{height:35mm}   /* 4けたを かける ときは 部分積が 4だん 出る */
.hissan .ansrow{display:flex;justify-content:flex-end;height:7mm;align-items:center}

/* わり算のひっ算 */
.wari{margin:3mm auto 0;font-size:6mm;line-height:1.3;font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;align-items:flex-end}
.wari .quo{display:flex;justify-content:flex-end;min-height:8mm;align-items:flex-end;padding-right:1mm}
.wari .in{display:flex;align-items:stretch}
.wari .dvs{padding:1mm 1.5mm 0 0;display:flex;align-items:flex-start}
.wari .dvd{
  border-top:1.1pt solid #1B3A5C;border-left:1.6pt solid #1B3A5C;
  border-top-left-radius:6mm 3mm;padding:1mm 1.5mm 0 2.5mm;
}

/* 100マス */
.masu{border-collapse:collapse;margin:0 auto;table-layout:fixed}
.masu td,.masu th{
  border:.7pt solid #9FB3C6;width:16mm;height:19mm;text-align:center;
  font-size:6mm;font-weight:400;font-variant-numeric:tabular-nums;padding:0;
}
.masu thead th,.masu tbody th{background:#EAF0F6;font-weight:700}
.masu .corner{background:#1B3A5C;color:#fff;font-size:7.5mm;font-weight:700}
.masu td .v{font-size:5.5mm}

/* ---------- せまい画面 ---------- */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .panel{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .units{max-height:none}
  .acts{margin-top:8px}
  .stage{padding:18px 12px 40px}
}

/* ---------- 印刷 ---------- */
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto;background:#fff}
  .panel{display:none}
  .app{display:block}
  .stage{padding:0;display:block;gap:0}
  .wrap{height:auto;width:auto;margin:0;overflow:hidden}
  /* 用紙の 高さを A4 ちょうど（297mm）に すると、ブラウザの まるめで
     1mm 未満が こぼれ、そこに 改ページが 重なって 白紙が 1ページ 生まれる。
     5mm 低くし（292mm）、その 5mm は 上下の 余白から 返すので、
     中身の 高さは 画面と 1mm も 変わらない。改ページは「次の用紙の 前」に 置く。 */
  .paper{transform:none!important;box-shadow:none;
         height:292mm;padding-top:12mm;padding-bottom:9mm;
         break-after:auto;page-break-after:auto;break-inside:auto;page-break-inside:auto}
  .stage .wrap + .wrap{break-before:page;page-break-before:always}
}
</style>
</head>
<body>
<div class="app">
<aside class="panel">
  <div class="brand"><h1>算数プリントメーカー</h1><span class="sz">A4</span>
    <a class="go" id="tosaiten" href="./saiten.html" hidden>さいてん →</a></div>

  <div class="grp">
    <span class="lb">学年 <em>いくつでも えらべます</em></span>
    <div class="chips" id="grade"></div>
  </div>

  <div class="grp">
    <span class="lb">ぶんや</span>
    <div class="chips" id="cat"></div>
  </div>

  <div class="grp">
    <span class="lb"><span>たんげん <em id="unitcount"></em></span>
      <button type="button" class="mini" id="mixmode" aria-pressed="false">まぜて えらぶ</button></span>
    <div class="chips units" id="unit"></div>
  </div>

  <div class="grp">
    <span class="lb">ことば / Language</span>
    <div class="seg g2" id="lang">
      <button type="button" data-v="ja" aria-pressed="true">日本語</button>
      <button type="button" data-v="en" aria-pressed="false">English</button>
    </div>
  </div>

  <div class="grp" id="g-form">
    <span class="lb">プリントの かたち</span>
    <div class="seg" id="type">
      <button type="button" data-v="yoko" aria-pressed="true">よこ式<small>ならべて出す</small></button>
      <button type="button" data-v="hissan" aria-pressed="false">ひっ算<small>マス目つき</small></button>
      <button type="button" data-v="masu" aria-pressed="false">100マス<small>タイム計測</small></button>
    </div>
  </div>

  <div class="grp" id="g-ops">
    <span class="lb">けいさん</span>
    <div class="ops" id="ops">
      <button type="button" data-v="+" aria-pressed="true" aria-label="たし算">＋</button>
      <button type="button" data-v="-" aria-pressed="false" aria-label="ひき算">－</button>
      <button type="button" data-v="*" aria-pressed="false" aria-label="かけ算">×</button>
      <button type="button" data-v="/" aria-pressed="false" aria-label="わり算">÷</button>
    </div>
  </div>

  <div class="grp" id="g-digits">
    <span class="lb">数の おおきさ</span>
    <div class="two">
      <label class="f"><span id="lbA">左の数</span>
        <select id="da"><option value="1">1けた</option><option value="2" selected>2けた</option><option value="3">3けた</option><option value="4">4けた</option></select>
      </label>
      <label class="f"><span id="lbB">右の数</span>
        <select id="db"><option value="1" selected>1けた</option><option value="2">2けた</option><option value="3">3けた</option><option value="4">4けた</option></select>
      </label>
    </div>
  </div>

  <div class="grp" id="g-carry">
    <span class="lb">くり上がり・くり下がり <em>＋と−だけに かかります</em></span>
    <select id="carry">
      <option value="any">どちらも 出す</option>
      <option value="none">ない ものだけ</option>
      <option value="only">ある ものだけ</option>
    </select>
  </div>

  <div class="grp" id="g-div" hidden>
    <span class="lb">わり算</span>
    <div class="radios">
      <label class="c"><input type="radio" name="dm" value="exact" checked><span>わりきれる</span></label>
      <label class="c"><input type="radio" name="dm" value="rem"><span>あまりが でる</span></label>
    </div>
  </div>

  <div class="grp" id="g-dec" hidden>
    <span class="lb">小数</span>
    <label class="f"><span>小数のけた</span>
      <select id="dp">
        <option value="1" selected>小数第1位まで（0.1）</option>
        <option value="2">小数第2位まで（0.01）</option>
      </select>
    </label>
  </div>

  <div class="grp" id="g-frac" hidden>
    <span class="lb">分数</span>
    <label class="f"><span>分母</span>
      <select id="fd">
        <option value="same">同じ分母だけ</option>
        <option value="diff" selected>ちがう分母（通分あり）</option>
      </select>
    </label>
  </div>

  <div class="grp" id="g-mixed" hidden>
    <span class="lb">四則混合</span>
    <label class="c"><input type="checkbox" id="paren" checked>
      <span>かっこの ある式を まぜる<small>( ) → × ÷ → ＋ － の じゅんばん</small></span></label>
  </div>

  <div class="grp" id="g-neg" hidden>
    <span class="lb">正負の数</span>
    <label class="c"><input type="checkbox" id="negparen" checked>
      <span>かっこを つける<small>(＋3) － (－8) の形にする</small></span></label>
  </div>

  <div class="grp" id="g-eq" hidden>
    <span class="lb">方程式の 形</span>
    <label class="f"><span>形</span>
      <select id="eqform">
        <option value="any" selected>おまかせ</option>
        <option value="a">ax + b = c</option>
        <option value="b">ax + b = cx + d</option>
      </select>
    </label>
  </div>

  <div class="grp" id="g-count">
    <div class="two">
      <label class="f"><span>問題の数</span><select id="count"></select></label>
      <label class="f"><span>1行の数</span>
        <select id="cols">
          <option value="auto" selected>おまかせ</option>
          <option value="1">1れつ</option>
          <option value="2">2れつ</option>
          <option value="3">3れつ</option>
        </select>
      </label>
    </div>
  </div>

  <div class="grp">
    <label class="f"><span>プリントの だいめい</span>
      <input type="text" id="title" maxlength="40"></label>
    <label class="c"><input type="checkbox" id="namerow" checked>
      <span>名前・日づけ・点数の らん</span></label>
  </div>

  <p class="warn" id="warn" hidden></p>

  <p class="warn" id="printhelp" hidden></p>

  <div class="acts">
    <button type="button" class="btn-new" id="regen">べつの問題に する</button>
    <button type="button" class="btn-print" id="print">A4で 印刷する</button>
    <div class="no"><span>プリント No.</span><b id="seed">0000</b></div>

</aside>

  var t = seed>>>0;
  return function(){
    t += 0x6D2B79F5;
    var r = Math.imul(t ^ t>>>15, 1|t);
    r ^= r + Math.imul(r ^ r>>>7, 61|r);

function ri(rand,lo,hi){ return lo + Math.floor(rand()*(hi-lo+1)); }

function hi(d){ return Math.pow(10,d)-1; }
function fromDigits(a){ return Number(a.join("")); }

/* ---------- 整数 ---------- */
function genAdd(rand,da,db,mode){
  if(mode!=="none"){
    var x = ri(rand,lo(da),hi(da)), y = ri(rand,lo(db),hi(db));
    if(mode==="only" && !carryAdd(x,y)) return null;      /* くり上がりの あるものだけ */
    return [x,y];
  }
  var A = [], B = [], i;
  for(i=0;i<da;i++) A.push(i===0 && da>1 ? ri(rand,1,8) : ri(rand,0,9));
  for(i=0;i<db;i++){
    var pos = da-db+i, cap = pos>=0 ? 9-A[pos] : 9;
    if(i===0 && db>1){ if(cap<1) return null; B.push(ri(rand,1,cap)); }
    else { if(cap<0) return null; B.push(ri(rand,0,cap)); }
  }
  var a = fromDigits(A), b = fromDigits(B);
  if(a<lo(da)||b<lo(db)||b<1) return null;
  return [a,b];
}
function genSub(rand,da,db,mode){
  if(da<db) da = db;
  if(mode!=="none"){
    var a = ri(rand,lo(da),hi(da)), b = ri(rand,lo(db),hi(db));
    if(b>a){ var t=a; a=b; b=t; }
    if(a===b) return null;
    if(mode==="only" && !borrowSub(a,b).any) return null; /* くり下がりの あるものだけ */
    return [a,b];
  }
  var B = [], A = [], i;
  for(i=0;i<db;i++) B.push(i===0 && db>1 ? ri(rand,1,8) : ri(rand,0,9));
  for(i=0;i<da;i++){
    var pos = i-(da-db);
    if(pos>=0) A.push(Math.min(9, B[pos] + ri(rand,0,9-B[pos])));
    else A.push(i===0 && da>1 ? ri(rand,1,9) : ri(rand,0,9));
  }
  if(da>1 && A[0]===0) A[0] = ri(rand,1,9);
  var x = fromDigits(A), y = fromDigits(B);
  if(x<lo(da)||y<lo(db)||y<1||x<=y) return null;
  return [x,y];
}
function genDiv(rand,da,db,mode){
  var dLo = Math.max(2,lo(db)), dHi = hi(db);
  if(dHi<dLo) return null;
  var d = ri(rand,dLo,dHi);
  var qLo = Math.max(2, Math.ceil(lo(da)/d)), qHi = Math.floor(hi(da)/d);
  if(qHi<qLo) return null;
  var q = ri(rand,qLo,qHi), r = mode==="rem" ? ri(rand,1,d-1) : 0, a = d*q + r;
  if(a>hi(da)){ a = d*q; r = 0; }
  if(mode==="rem" && r===0) return null;
  return [a,d,q,r];
}
/* ---------- 問題の「型」の 印 ----------
   採点の 見立てで「どこで つまずいたか」を 言うために、
   問題を 作った ときに わかる 特ちょうを 短い文字で のこす。
   c=繰り上がり/繰り下がり  z=0から借りる  r=あまり  w=2けたを かける/わる
   k=小数点の位がそろわない  n=答えの末尾が0  t=通分  y=約分  m=帯分数
   L/R=□の位置  p=かっこ  g=答えがマイナス  x=両辺にx           */
function carryAdd(a,b){
  var x = String(a).split("").reverse(), y = String(b).split("").reverse(), i, c = 0, s;
  for(i=0;i<x.length;i++){
    s = (+x[i]||0) + (+y[i]||0) + c;
    if(s>=10) return true;
    c = 0;
  }
  return false;
}
function borrowSub(a,b){
  var x = String(a).split("").reverse(), y = String(b).split("").reverse(), i, d, br = 0,
      any = false, zero = false;
  for(i=0;i<x.length;i++){
    d = (+x[i]) - (+y[i]||0) - br;
    if(d<0){ any = true; if(x[i+1]==="0") zero = true; br = 1; } else br = 0;
  }
  return {any:any, zero:zero};
}
function intSub(op,a,b,rem){
  var t = "";
  if(op==="+"){ if(carryAdd(a,b)) t += "c"; }
  else if(op==="-"){ var w = borrowSub(a,b); if(w.any) t += "c"; if(w.zero) t += "z"; }
  else if(op==="*"){ if(String(b).length>=2) t += "w"; }
  else { if(rem) t += "r"; if(String(b).length>=2) t += "w"; }
  return t;
}
function uInt(rand,o){
  var op = pick(rand,o.ops), p, ans, rem = 0;
  if((op==="-"||op==="/") && o.da < o.db) o.da = o.db;   /* けたが 逆だと 作れないので そろえる */
  if(op==="+"){ p = genAdd(rand,o.da,o.db,o.carry); if(!p) return null; ans = p[0]+p[1]; }
  else if(op==="-"){ p = genSub(rand,o.da,o.db,o.carry); if(!p) return null; ans = p[0]-p[1]; }
  else if(op==="*"){ p = [ri(rand,Math.max(2,lo(o.da)),hi(o.da)), ri(rand,Math.max(2,lo(o.db)),hi(o.db))];
    ans = p[0]*p[1]; }
  else { p = genDiv(rand,o.da,o.db,o.divmode); if(!p) return null; ans = p[2]; rem = p[3]; }
  return {
    kind:"calc", op:op, sub:intSub(op,p[0],p[1],rem), key:"i"+op+p[0]+"_"+p[1],
    ex:p[0]+" "+sign(op)+" "+p[1], eq:eqs(),
    ans: rem ? (LANG==="ja" ? ans+" あまり "+rem : ans+" r "+rem) : String(ans),
    h:{kind: op==="/" ? "div" : "col", op:op, sa:String(p[0]), sb:String(p[1]),
       sans:String(ans), rem:rem, mulrows:String(p[1]).length}
  };
}
/* ---------- 虫食い算（□を もとめる） ---------- */
function uHole(rand,o){
  var op = pick(rand,o.ops), p, a, b, c;
  if((op==="-"||op==="/") && o.da < o.db) o.da = o.db;
  if(op==="+"){ p = genAdd(rand,o.da,o.db,o.carry); if(!p) return null; a=p[0]; b=p[1]; c=a+b; }
  else if(op==="-"){ p = genSub(rand,o.da,o.db,o.carry); if(!p) return null; a=p[0]; b=p[1]; c=a-b; }
  else if(op==="*"){ a = ri(rand,Math.max(2,lo(o.da)),hi(o.da)); b = ri(rand,Math.max(2,lo(o.db)),hi(o.db)); c = a*b; }
  else { p = genDiv(rand,o.da,o.db,"exact"); if(!p) return null; a=p[0]; b=p[1]; c=p[2]; }
  var left = (((o.n||0)+(o.off||0)) % 2) === 0;     /* □ を 左と右に かわりばんこで 置く */
  return {kind:"calc", op:op, sub:(left?"L":"R")+intSub(op,a,b,0), key:"H"+op+a+"_"+b+(left?"L":"R"),
    ex: (left ? "□" : a) + " " + sign(op) + " " + (left ? b : "□") + " " + eqs() + " " + c,
    eq: "□ " + eqs(), ans: String(left ? a : b)};
}

/* ---------- 小数 ---------- */
function uDec(rand,o){
  var op = pick(rand,o.ops), p = o.dp, A,B,pa,pb,pans,ansN,sa,sb,sans,pd = 0;
  if(op==="+"||op==="-"){
    pa = p; pb = ri(rand,1,p);
    A = ri(rand, Math.pow(10,pa), Math.pow(10,pa+2)-1);
    B = ri(rand, Math.pow(10,pb), Math.pow(10,pb+1)-1);
    var m = Math.max(pa,pb), an = A*Math.pow(10,m-pa), bn = B*Math.pow(10,m-pb);
    if(op==="-"){
      if(an===bn) return null;
      if(bn>an){ var t=an;an=bn;bn=t; var t2=A;A=B;B=t2; var t3=pa;pa=pb;pb=t3; }
    }
    ansN = op==="+" ? an+bn : an-bn; pans = m;
    sa = dfmt(A,pa); sb = dfmt(B,pb); sans = dfmt(ansN,pans);
  } else if(op==="*"){
    pa = p; A = ri(rand, Math.pow(10,pa), Math.pow(10,pa+2)-1);
    if(o.grade<5){ B = ri(rand,2,9); pb = 0; } else { pb = 1; B = ri(rand,11,99); }
    sa = dfmt(A,pa); sb = dfmt(B,pb); sans = dfmt(A*B,pa+pb);
  } else {
    var q,d,pq;
    if(o.grade<5){ pq = p; q = ri(rand,Math.pow(10,pq),Math.pow(10,pq+1)-1); pd = 0; d = ri(rand,2,9); }
    else { pq = ri(rand,0,1); q = ri(rand, pq?11:2, pq?99:19); pd = 1; d = ri(rand,11,99); }
    sa = dfmt(q*d,pq+pd); sb = dfmt(d,pd); sans = dfmt(q,pq);
  }
  /* 印は 紙に 出ている 数から 決める（内部の けた数では ない）*/
  var dsub = "", dpOf = function(x){ var i = String(x).indexOf("."); return i<0 ? 0 : String(x).length-i-1; };
  var ka = dpOf(sa), kb = dpOf(sb), km = Math.max(ka,kb);
  if(op==="+"||op==="-"){
    if(ka!==kb) dsub += "k";                                  /* 小数点の 位が そろわない */
    var ia = Math.round(Number(sa)*Math.pow(10,km)), ib = Math.round(Number(sb)*Math.pow(10,km));
    if(op==="+" ? carryAdd(ia,ib) : borrowSub(ia,ib).any) dsub += "c";
    if(dpOf(sans) < km) dsub += "n";                          /* 末尾の 0 が 消える */
  } else if(kb>=1) dsub += "w";                               /* 小数を かける・小数で わる */
  return {kind:"calc", op:op, sub:dsub, key:"d"+op+sa+"_"+sb, ex:sa+" "+sign(op)+" "+sb, eq:eqs(), ans:sans,
    h:{kind:"col", op:op, sa:sa, sb:sb, sans:sans, rem:0, mulrows:1}};
}
/* ---------- 分数 ---------- */
function uFrac(rand,o){
  var op = pick(rand,o.ops), d1,d2,n1,n2,N,D;
  if(op==="+"||op==="-"){
    d1 = ri(rand,2,9);

    if(o.fd==="diff" && d2===d1) return null;
    n1 = ri(rand,1,d1-1); n2 = ri(rand,1,d2-1);
    N = op==="+" ? n1*d2+n2*d1 : n1*d2-n2*d1; D = d1*d2;
    if(op==="-" && N<=0) return null;
  } else {
    d1 = ri(rand,2,9); d2 = ri(rand,2,9);
    n1 = ri(rand,1,d1-1); n2 = ri(rand,1,d2-1);
    if(op==="*"){ N = n1*n2; D = d1*d2; } else { N = n1*d2; D = d1*n2; }
  }
  var fsub = "";
  if(d1!==d2) fsub += "t";                                    /* 通分が 要る */
  if(gcd(N,D)>1) fsub += "y";                                 /* 約分が 要る */
  if(N>=D) fsub += "m";                                       /* 帯分数に なおす */
  return {kind:"calc", op:op, sub:fsub, key:"f"+op+n1+"/"+d1+"_"+n2+"/"+d2,
    ex:frHTML(n1,d1)+" "+sign(op)+" "+frHTML(n2,d2), eq:eqs(), ans:fracAnsHTML(N,D)};

/* ---------- 四則混合 ---------- */
function uMixed(rand,o){

  if(pat===1){ a=ri(rand,2,40); b=ri(rand,2,9); c=ri(rand,2,9); ex=a+" "+P+" "+b+" "+M+" "+c; ans=a+b*c; }
  else if(pat===2){ a=ri(rand,2,9); b=ri(rand,2,9); c=ri(rand,2,40); ex=a+" "+M+" "+b+" "+P+" "+c; ans=a*b+c; }
  else if(pat===3){ b=ri(rand,2,9); c=ri(rand,2,9); a=b*c+ri(rand,1,40); ex=a+" "+S+" "+b+" "+M+" "+c; ans=a-b*c; }
  else if(pat===4){ b=ri(rand,3,9); c=ri(rand,3,9); a=ri(rand,1,b*c-1); ex=b+" "+M+" "+c+" "+S+" "+a; ans=b*c-a; }
  else if(pat===5){ c=ri(rand,2,9); b=c*ri(rand,2,9); a=ri(rand,2,40); ex=a+" "+P+" "+b+" "+D+" "+c; ans=a+b/c; }
  else if(pat===6){ a=ri(rand,2,9); b=ri(rand,2,20); c=ri(rand,2,20); ex=a+" "+M+" ( "+b+" "+P+" "+c+" )"; ans=a*(b+c); }
  else if(pat===7){ c=ri(rand,2,9); var q=ri(rand,2,12); b=ri(rand,1,c*q-1); a=c*q-b;
    ex="( "+a+" "+P+" "+b+" ) "+D+" "+c; ans=(a+b)/c; }
  else { c=ri(rand,2,9); var e=ri(rand,2,15); b=ri(rand,1,30); a=b+e; ex="( "+a+" "+S+" "+b+" ) "+M+" "+c; ans=(a-b)*c; }
  return {kind:"calc", sub:(pat>=6?"p":"")+(pat===5||pat===7?"d":""),
    key:"m"+ex, ex:ex, eq:eqs(), ans:String(ans)};
}
/* ---------- がい数（四捨五入） ---------- */

/* ---------- 割合・百分率 ---------- */

/* ---------- 文字と式 ---------- */

/* ---------- 正負の数 ---------- */
function sgn(n,paren){ return paren ? "("+(n<0?"−":"+")+Math.abs(n)+")" : mnum(n); }

/* ---------- 一次方程式 ---------- */
function term(a){ return a===1 ? "x" : a===-1 ? "−x" : (a<0 ? "−"+Math.abs(a)+"x" : a+"x"); }
function plus(n){ return (n<0 ? " − " : " + ") + Math.abs(n); }
function uEq(rand,o){
  var x = ri(rand,-9,9); if(x===0) x = ri(rand,1,9);
  var form = o.eqform==="any" ? pick(rand,["a","b"]) : o.eqform, a,b,c,d,ex;
  if(form==="a"){
    a = ri(rand,2,9); b = ri(rand,-9,9); if(b===0) b = 3;
    c = a*x + b;
    if(Math.abs(c)>60) return null;

  } else {
    a = ri(rand,2,9); c = ri(rand,-9,9);
    if(c===a || c===0) c = a===2 ? 5 : 2;
    b = ri(rand,-9,9); if(b===0) b = 4;
    d = (a-c)*x + b;
    if(d===0 || Math.abs(d)>60) return null;
    ex = term(a)+plus(b)+" = "+term(c)+plus(d);
  }
  return {kind:"calc", key:"e"+ex, ex:ex, eq:"x =", ans:mnum(x)};
}
/* ---------- 比例と反比例 ---------- */
function uProp(rand,o){
  var a = ri(rand,2,9), x1 = ri(rand,2,9), x2 = ri(rand,2,12), inv = o.grade>=6 && rand()<0.4;
  var guard = 0;
  while(x2===x1 && guard++<20) x2 = ri(rand,2,12);   /* 同じ x を 2回 聞かない */
  if(x2===x1) return null;
  if(inv){
    var k = a*x1*2, ds = [], d;
    for(d=2; d<=20; d++) if(k%d===0 && d!==x1) ds.push(d);
    if(!ds.length) return null;
    x2 = ds[Math.floor(rand()*ds.length)];          /* わり切れる x だけ 聞く */
    return {kind:"calc", long:true, key:"P2"+k+x1+x2,
      ex:T("y は x に 反比例し、x＝"+x1+" のとき y＝"+(k/x1)+"です。x＝"+x2+" のとき y は",
           "y varies inversely with x. When x = "+x1+", y = "+(k/x1)+". Find y when x = "+x2+"."),
      eq:"", ans:num1(k/x2)};
  }
  return {kind:"calc", long:true, key:"P1"+a+x1+x2,
    ex:T("y は x に 比例し、x＝"+x1+" のとき y＝"+(a*x1)+"です。x＝"+x2+" のとき y は",
         "y varies directly with x. When x = "+x1+", y = "+(a*x1)+". Find y when x = "+x2+"."),
    eq:"", ans:String(a*x2)};
}

   図形（図は SVG。線の色は 用紙の色を つかう）

var PI = 3.14;
function ask(ja,en){ return T(ja,en); }
function u2(){ return "cm²"; }
function u3(){ return "cm³"; }

/* 図を かく ための 道具 */
function fitBox(w,h,maxW,maxH,minW,minH){
  var sc = Math.min(maxW/w, maxH/h);
  var dw = w*sc, dh = h*sc;
  if(dw<minW){ dh *= minW/dw; dw = minW; }
  if(dh<minH){ dw *= minH/dh; dh = minH; }
  if(dw>maxW){ dh *= maxW/dw; dw = maxW; }
  if(dh>maxH){ dw *= maxH/dh; dh = maxH; }
  return {w:+dw.toFixed(1), h:+dh.toFixed(1)};
}
function polar(cx,cy,r,deg){ var t = deg*Math.PI/180; return [cx+r*Math.cos(t), cy-r*Math.sin(t)]; }
function arcPath(cx,cy,r,d1,d2){
  var p1 = polar(cx,cy,r,d1), p2 = polar(cx,cy,r,d2), big = (d2-d1)>180 ? 1 : 0;
  return '<path d="M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' A'+r+' '+r+' 0 '+big+' 0 '
       + p2[0].toFixed(1)+' '+p2[1].toFixed(1)+'" stroke-width="1"/>';
}
function ray(cx,cy,r,deg){
  var p = polar(cx,cy,r,deg);
  return '<path d="M'+cx+' '+cy+' L'+p[0].toFixed(1)+' '+p[1].toFixed(1)+'"/>';
}
function vdim(x,y1,y2,label){
  return '<path d="M'+(x-4)+' '+y1+' H'+(x+4)+'"/><path d="M'+(x-4)+' '+y2+' H'+(x+4)+'"/>'
       + '<path d="M'+x+' '+y1+' V'+y2+'" stroke-dasharray="3 2"/>'
       + tx(x+6, ((y1+y2)/2+3).toFixed(1), label, "start", 8);
}
function lab(cx,cy,r,deg,s,size){
  var p = polar(cx,cy,r,deg);
  return tx(p[0].toFixed(1), (p[1]+3).toFixed(1), s, "middle", size||9);
}

  return {kind:"fig", tid:"vol5", key:"v5"+a+"_"+b+"_"+c, fig:boxSVG(a,b,c),

}

/* 四則の文章題（小3・小4）。小4からは 2だんかいの 問題も 出す */
function uWArith(rand,o){
  var n = nm(rand), t = thing(rand), t2 = thing(rand);

  if(o.grade>=4) types = types.concat(["ni_kai","ni_nokori"]);
  var k = cyc(types,o), a, b, c;

    a = ri(rand,12,80); b = ri(rand,12,80);

      ask("赤い "+t.n+"が "+ct(a,t.c)+"、青い "+t.n+"が "+ct(b,t.c)+" あります。あわせて 何"+(t.c||"こ")+" ありますか。",
          "There are "+a+" red "+t.n+" and "+b+" blue "+t.n+". How many are there altogether?"),
      ct(a+b,t.c));
  }
  if(k==="morau"){
    a = ri(rand,12,80); b = ri(rand,12,60);
    return W(k,"w"+k+a+b,
      ask(n+"は "+t.n+"を "+ct(a,t.c)+" もっています。おねえさんから "+ct(b,t.c)+" もらいました。ぜんぶで 何"+(t.c||"こ")+"に なりますか。",
          n+" has "+a+" "+t.n+" and gets "+b+" more. How many "+t.n+" are there in all?"),
      ct(a+b,t.c));
  }
  if(k==="nokori"){
    a = ri(rand,40,120); b = ri(rand,10,39);
    return W(k,"w"+k+a+b,
      ask(t.n+"が "+ct(a,t.c)+" あります。"+ct(b,t.c)+" つかいました。のこりは 何"+(t.c||"こ")+"ですか。",
          "There are "+a+" "+t.n+". "+b+" are used. How many are left?"),
      ct(a-b,t.c));
  }
  if(k==="chigai"){
    a = ri(rand,30,99); b = ri(rand,10,29);
    return W(k,"w"+k+a+b,
      ask(n+"は "+t.n+"を "+ct(a,t.c)+"、弟は "+ct(b,t.c)+" もっています。ちがいは 何"+(t.c||"こ")+"ですか。",
          n+" has "+a+" "+t.n+" and their brother has "+b+". How many more does "+n+" have?"),
      ct(a-b,t.c));
  }
  if(k==="bai"){
    a = ri(rand,3,9); b = ri(rand,4,12);
    return W(k,"w"+k+a+b,
      ask("1はこに "+t.n+"が "+ct(b,t.c)+" 入っています。"+a+"はこでは 何"+(t.c||"こ")+"に なりますか。",
          "Each box holds "+b+" "+t.n+". How many "+t.n+" are in "+a+" boxes?"),
      ct(a*b,t.c));
  }
  if(k==="toubun"){
    b = ri(rand,3,9); c = ri(rand,3,12); a = b*c;
    return W(k,"w"+k+a+b,
      ask(t.n+"が "+ct(a,t.c)+" あります。"+b+"人で 同じ数ずつ 分けると、1人分は 何"+(t.c||"こ")+"ですか。",
          "There are "+a+" "+t.n+" shared equally among "+b+" children. How many does each child get?"),
      ct(c,t.c));
  }
  if(k==="amari"){
    b = ri(rand,3,9); c = ri(rand,3,12);
    var r = ri(rand,1,b-1); a = b*c+r;
    return W(k,"w"+k+a+b,
      ask(t.n+"が "+ct(a,t.c)+" あります。1ふくろに "+ct(b,t.c)+"ずつ 入れると、何ふくろ できて 何"+(t.c||"こ")+" あまりますか。",
          "There are "+a+" "+t.n+". If "+b+" go in each bag, how many bags can be filled and how many are left over?"),
      ask(c+"ふくろ できて "+ct(r,t.c)+" あまる", c+" bags, "+r+" left over"));
  }
  if(k==="oturi"){
    a = ri(rand,3,9)*10; b = ri(rand,3,9);
    c = (Math.floor(a*b/100) + 1 + ri(rand,0,2)) * 100;   /* 代金より 必ず 多く 出す */
    return W(k,"w"+k+a+b,
      ask("1本 "+a+"円の "+t.n+"を "+b+"本 買って、"+c+"円 出しました。おつりは 何円ですか。",
          "One costs "+a+" yen. You buy "+b+" of them and pay with "+c+" yen. How much change do you get?"),
      ask((c-a*b)+"円", (c-a*b)+" yen"));
  }
  if(k==="ni_kai"){                                  /* 2だんかい：×と＋ */
    a = ri(rand,4,9)*10; b = ri(rand,2,6); c = ri(rand,4,9)*10;
    return W(k,"w"+k+a+b+c,
      ask("1こ "+a+"円の "+t.n+"を "+b+"こ と、"+c+"円の "+t2.n+"を 1つ 買います。代金は あわせて 何円ですか。",
          "You buy "+b+" items at "+a+" yen each and one item for "+c+" yen. What is the total?"),
      ask((a*b+c)+"円", (a*b+c)+" yen"));
  }
  /* 2だんかい：全体から 配った ぶんを ひく */
  a = ri(rand,60,150); b = ri(rand,3,8); c = ri(rand,3,9);
  if(b*c>=a) a = b*c + ri(rand,5,40);
  return W("ni_nokori","wni2"+a+b+c,
    ask(t.n+"が "+ct(a,t.c)+" あります。"+b+"人に "+ct(c,t.c)+"ずつ 配ると、のこりは 何"+(t.c||"こ")+"ですか。",
        "There are "+a+" "+t.n+". Each of "+b+" children gets "+c+". How many are left?"),
    ct(a-b*c,t.c));
}
/* 時こくと時間（小3） */
function uWTime(rand,o){
  function hm(H,M){ H=((H-1)%12+12)%12+1; return LANG==="ja" ? H+"時"+(M===0?"":M+"分") : H+":"+(M<10?"0"+M:M); }

  if(k==="aida") return W(k,"t"+k+t0+d,
    ask(hm(h,m)+" から "+hm(Math.floor(t1/60),t1%60)+" までは 何分間ですか。",
        "How many minutes are there from "+hm(h,m)+" to "+hm(Math.floor(t1/60),t1%60)+"?"),

        "You leave home at "+hm(h,m)+" and the walk to the station takes "+d+" minutes. What time do you arrive?"),

  return W("mae","t"+"mae"+t1+d,

        "It is "+hm(Math.floor(t1/60),t1%60)+". What time was it "+d+" minutes ago?"),
    hm(h,m));
}
/* 単位量あたり（小5） */
function uWUnit(rand,o){

          "There are "+b+" flower beds of the same size covering "+(a*b)+" m² in all. What is the area of one bed?"),

  }

/* 割合の文章題（小5・小6） */
function uWRatio(rand,o){

/* 平均（小5） */
function uWAverage(rand,o){
  var k = cyc(["heikin","goukei","ochi"],o), i, v = [], sum = 0;
  var cnt = pick(rand,[4,5]), avg = ri(rand,50,90);
  for(i=0;i<cnt-1;i++){ var x = avg + ri(rand,-12,12); v.push(x); sum += x; }
  v.push(avg*cnt - sum);
  if(v[cnt-1]<0 || v[cnt-1]>100) return null;
  if(k==="heikin") return W(k,"av"+v.join("_"),
    ask("テストの 点数は "+v.join("点、")+"点でした。平均は 何点ですか。",
        "Test scores were "+v.join(", ")+". What is the mean score?"),
    ask(avg+"点", String(avg)));
  if(k==="goukei"){
    var d = ri(rand,3,8), ave = ri(rand,20,60);
    return W(k,"av"+"g"+d+ave,
      ask(d+"日間の 平均が "+ave+"ページのとき、読んだ ページは あわせて 何ページですか。",
          "Over "+d+" days the mean was "+ave+" pages a day. How many pages in total?"),
      ask((d*ave)+"ページ", String(d*ave)));
  }
  var known = v.slice(0,cnt-1), last = v[cnt-1];
  return W("ochi","av"+"o"+v.join("_"),
    ask(cnt+"回の テストの 平均が "+avg+"点でした。はじめの "+(cnt-1)+"回は "+known.join("点、")+"点です。"
      + "のこりの 1回は 何点ですか。",
        "The mean of "+cnt+" tests is "+avg+". The first "+(cnt-1)+" scores are "+known.join(", ")+". What is the last score?"),
    ask(last+"点", String(last)));
}
/* 分数の文章題（小6） */
function uWFrac(rand,o){

function unitOf(id){

/* ミックスの ときに つかう、単元ごとの きほん設定 */
function unitDefaults(id,grade){
  var o = {grade:grade, ops:["+"], da:2, db:1, carry:"any", divmode:"exact",
           dp:1, fd:"diff", paren:true, negparen:true, eqform:"any"};
  if(id==="int"){
    if(grade<=3){ o.ops=["+","-","*"]; o.da=3; o.db=2; }
    else if(grade===4){ o.ops=["*","/"]; o.da=3; o.db=2; o.divmode="rem"; }
    else { o.ops=["+","-","*","/"]; o.da=3; o.db=2; }
  }
  if(id==="hole") o.ops = grade<=3 ? ["+","-"] : ["+","-","*","/"];
  if(id==="dec"){ o.ops = grade<5 ? ["+","-","*"] : ["+","-","*","/"]; }
  if(id==="frac"){
    o.ops = grade<6 ? ["+","-"] : ["+","-","*","/"];
    if(grade<=4) o.fd = "same";                    /* 小4は 同じ分母だけ */
  }
  if(id==="neg")  o.ops = ["+","-","*","/"];
  return o;
}

var state = {
  grades:[4], cats:["calc","fig","word"], units:["int"], lang:"ja",
  type:"hissan", ops:["/"], da:3, db:2, carry:"any", divmode:"rem",
  dp:1, fd:"diff", paren:true, negparen:true, eqform:"any",
  count:12, cols:"auto", mixmode:false, countAuto:true,
  title:"", titleDirty:false, namerow:true, carry:"any",
  seed:Math.floor(Math.random()*9000)+1000
};
function visibleUnits(){
  return UNITS.filter(function(u){
    if(state.cats.indexOf(u.cat)<0) return false;
    for(var i=0;i<u.g.length;i++) if(state.grades.indexOf(u.g[i])>=0) return true;
    return false;
  });
}
function chosenUnits(){
  var vis = visibleUnits();
  return vis.filter(function(u){ return state.units.indexOf(u.id)>=0; });
}
function gradesFor(u){
  return u.g.filter(function(g){ return state.grades.indexOf(g)>=0; });
}
function single(){
  var c = chosenUnits();
  return c.length===1 ? c[0] : null;
}
/* えらんだ単元が つかえる かたち */
function allowedForms(){
  var c = chosenUnits();
  if(!c.length) return ["yoko"];
  var f = null, i;
  for(i=0;i<c.length;i++){
    var uf = c[i].forms || ["yoko"];
    if(c[i].cat!=="calc") return [];
    f = f===null ? uf.slice() : f.filter(function(x){ return uf.indexOf(x)>=0; });
  }
  if(!f.length) f = ["yoko"];
  if(c.length>1) f = f.filter(function(x){ return x!=="masu"; });
  var s = single();
  if(s && s.id==="dec" && (state.ops.indexOf("*")>=0 || state.ops.indexOf("/")>=0))
    f = f.filter(function(x){ return x!=="hissan"; });
  return f;
}
function allowedOps(){
  var s = single();
  if(!s || !s.ops) return [];
  if(s.id==="frac" && state.grades.every(function(g){ return g<6; })) return ["+","-"];
  return ["+","-","*","/"];
}
function optsOf(u,grade){
  var d = unitDefaults(u.id,grade), s = single(), k;
  if(s && s.id===u.id){
    var keys = ["ops","da","db","carry","divmode","dp","fd","paren","negparen","eqform"];
    for(k=0;k<keys.length;k++) if(state[keys[k]]!==undefined) d[keys[k]] = state[keys[k]];
    d.grade = grade;
    if(!d.ops.length) d.ops = unitDefaults(u.id,grade).ops;
  }
  return d;
}

/* ==========================================================
   1まいぶんの 問題を つくる
   ========================================================== */
function makeSet(st){
  var rand = mulberry(st.seed*2654435761 % 4294967296);
  var us = chosenUnits().slice();
  if(!us.length) return [];
  for(var j=us.length-1;j>0;j--){                  /* 単元の じゅんを まぜる */
    var k = Math.floor(rand()*(j+1)), tmp = us[j]; us[j] = us[k]; us[k] = tmp;
  }
  var out = [], seen = {}, tries = 0, cap = Math.min(st.count*300, 20000), i = 0, made = {};
  while(out.length<st.count && tries<cap){
    tries++;
    var u = us[i % us.length];
    var gs = gradesFor(u);
    var grade = gs.length===1 ? gs[0] : gs[Math.floor(rand()*gs.length)];
    var q = null;
    try {
      var opt = optsOf(u,grade);
      opt.n = made[u.id] || 0;                     /* この単元で 何問目か（型を 順ぐりに つかう） */
      opt.off = (st.seed + u.id.length) % 7;
      q = u.gen(rand, opt);
    } catch(e){ q = null; }
    if(!q || seen[q.key]) continue;
    seen[q.key] = 1;
    made[u.id] = (made[u.id] || 0) + 1;
    q.unit = u; q.grade = grade;
    q.sub = q.sub || q.tid || "";                /* 問題の 型（見立てで つかう） */
    out.push(q); i++;
  }
  return out;
}
/* 100マスに できるのは たし算・ひき算・かけ算だけ。
   わり算は マスが きれいに 割りきれないので 作れない。
   えらばれて いる 演算が わり算の ときは たし算に もどす
   （題も 見出しも ここから 出すので、表と 食いちがわない）。 */
var MASUOPS = ["+","-","*"];
function masuOp(ops){
  var i;
  for(i=0;i<(ops||[]).length;i++) if(MASUOPS.indexOf(ops[i])>=0) return ops[i];
  return "+";
}
function makeMasu(st){
  var rand = mulberry((st.seed*40503+7) % 4294967296);
  var op = masuOp(st.ops);
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){ var j=Math.floor(rand()*(i+1)); var t=arr[i];arr[i]=arr[j];arr[j]=t; }
    return arr;
  }
  var base = [], i;
  for(i=0;i<10;i++) base.push(i);
  var cols = shuffle(base.slice()), rows;
  if(op==="-"){ rows = []; for(i=10;i<20;i++) rows.push(i); shuffle(rows); }
  else rows = shuffle(base.slice());
  return {op:op, cols:cols, rows:rows};
}

/* 中身が 入りきる 列の 数の 上限。ここを こえると 紙から はみ出す。
   「1行の 数」を 自分で えらんだ ときも、ここで おさえる。 */
function maxCols(st,qs,sheet){
  if(sheet==="hissan") return (st.da>=4 || st.db>=3) ? 2 : 3;
  if(sheet==="block")  return 2;            /* 図や 文は はばが 要る */
  return 3;                                 /* 横に 入るかは 描いてから 測る */
}
function autoCols(st,qs,sheet){
  return Math.min(maxCols(st,qs,sheet), autoColsWant(st,qs,sheet));
}
function autoColsWant(st,qs,sheet){
  if(st.cols!=="auto") return Number(st.cols);
  if(sheet==="hissan") return (st.da>=4||st.db>=3) ? 2 : 3;
  if(sheet==="block")  return st.count<=6 ? 1 : 2;
  var s = single(), longish = false, i;
  for(i=0;i<qs.length;i++) if(String(qs[i].ex).length > 22) longish = true;
  if(s && (s.id==="eq"||s.id==="mixed"||s.id==="prop"||s.id==="ratioc"||s.id==="round"||s.id==="divisor"||s.id==="hi"||s.id==="letter"||s.id==="unit"||s.id==="hole")) return 2;
  if(longish) return 2;
  if(s && s.id==="int") return (st.da>=3 || st.db>=3 || st.ops.indexOf("/")>=0) ? 2 : 3;
  if(s && s.id==="dec") return st.dp>=2 ? 2 : 3;
  if(s && s.id==="neg") return st.negparen ? 2 : 3;
  return 3;
}

function hissanHTML(qs,cols){

function masuHTML(m){

/* だいめい・小見出し */
/* 学年の ならびを 書く。とんで いる ときに 「小3〜小5」と 書くと
   小4も 入って いるように 読めるので、そこは 「小3・小5」と 並べる。 */
function gradeSpan(g,lang){
  var i, lg = lang || LANG, nm = function(x){ return GRADENAME[x][lg]; };
  if(!g.length) return "";
  if(g.length===1) return nm(g[0]);
  for(i=1;i<g.length;i++) if(g[i]!==g[i-1]+1) return g.map(nm).join(lg==="en"?", ":"・");
  return nm(g[0])+(lg==="en"?"–":"〜")+nm(g[g.length-1]);
}
function gradeLabel(){
  var g = state.grades.filter(function(x){ return GRADENAME[x]; }).sort(function(a,b){return a-b;});
  return gradeSpan(g);
}
function autoTitle(){
  var c = chosenUnits(), head = gradeLabel()+" ";
  if(!c.length) return head+T("プリント","Worksheet");
  if(c.length===1){
    var u = c[0], nm2 = u[LANG];
    if(u.id==="int"){
      var one = state.ops.length===1 ? T({"+":"たし算","-":"ひき算","*":"かけ算","/":"わり算"}[state.ops[0]],
        {"+":"Addition","-":"Subtraction","*":"Multiplication","/":"Division"}[state.ops[0]]) : nm2;
      return head+one+T(state.type==="hissan" ? "の ひっ算" : "", state.type==="hissan" ? " (column form)" : "");
    }
    return head+nm2;
  }
  var cats = {}, i;
  for(i=0;i<c.length;i++) cats[c[i].cat] = 1;
  var ks = Object.keys(cats);
  if(ks.length===1){
    var cn = CATS.filter(function(x){ return x.id===ks[0]; })[0];
    return head+cn[LANG]+T(" ミックス"," mix");
  }
  return head+T("まとめ ミックス","Mixed practice");
}
function hint(st,qs){
  var c = chosenUnits(), bits = [gradeLabel()], i;
  if(c.length===1){
    var u = c[0];
    bits.push(u[LANG]);
    if(u.id==="int" || u.id==="dec" || u.id==="frac" || u.id==="neg"){
      bits.push(st.ops.map(function(o){ return T({"+":"たし算","-":"ひき算","*":"かけ算","/":"わり算"}[o],
        {"+":"add","-":"subtract","*":"multiply","/":"divide"}[o]); }).join(T("・","/")));
    }
    if(u.id==="int" && st.type!=="masu"){
      bits.push(T(st.da+"けた と "+st.db+"けた", st.da+"-digit & "+st.db+"-digit"));
      if(st.carry==="none") bits.push(T("くり上がり・くり下がりなし","no regrouping"));
      else if(st.carry==="only") bits.push(T("くり上がり・くり下がりあり","regrouping only"));
      if(st.ops.indexOf("/")>=0) bits.push(T(st.divmode==="rem"?"あまりあり":"わりきれる", st.divmode==="rem"?"with remainders":"exact"));
    }
    if(u.id==="dec") bits.push(T(st.dp===2?"小数第2位まで":"小数第1位まで", st.dp===2?"2 decimal places":"1 decimal place"));
    if(u.id==="frac") bits.push(T(st.fd==="same"?"同じ分母":"ちがう分母", st.fd==="same"?"like denominators":"unlike denominators"));
    if(st.type==="masu") bits.push(T("100マス","100 squares"));
  } else {
    var names = c.map(function(u){ return u[LANG]; });
    bits.push(names.slice(0,4).join(T("・",", ")) + (names.length>4 ? T(" ほか"," and more") : ""));
  }
  return bits.join(T("　/　"," / "));
}
/* ------------------------------------------------------------------
   QR の 中身
   紙に のせられる 大きさに おさめたいので、できるだけ 短く する。
   ・分数は 5~12、帯分数は 1_5~12（/ は URL で ふくらむので ~ に する）
   ・「あまり」は r の 1文字に する
   ・区切りは URL で そのまま 通る ! * - . _ ~ だけを つかう
   ------------------------------------------------------------------ */
var OPC = {"+":"a","-":"s","*":"m","/":"d"};
function plainAns(h){
  var s = String(h);
  s = s.replace(/<span class="mx">(\d+)<span class="fr"><b>(\d+)<\/b><i>(\d+)<\/i><\/span><\/span>/g,"$1_$2~$3");
  s = s.replace(/<span class="fr"><b>(\d+)<\/b><i>(\d+)<\/i><\/span>/g,"$1~$2");
  s = s.replace(/<[^>]+>/g,"");
  s = s.replace(/(\d)\s*(?:あまり|r)\s*(\d)/g,"$1r$2").replace(/\//g,"~");
  return s.replace(/[!*]/g,"").replace(/\s+/g,"_").replace(/^_+|_+$/g,"");
}
/* このプリントの むずかしさ（けた数・あまり・くり上がり）。
   ちがう設定の プリントを ならべて「けたが 増えると 落ちる」を 見るために わたす */
function sheetProf(st,sheet){
  return (sheet||"yoko").charAt(0)
    + (st.da||0) + (st.db||0)
    + (st.divmode==="rem" ? "r" : "")
    + (st.carry==="none" ? "n" : st.carry==="only" ? "o" : "")
    + (st.fd==="diff" ? "t" : "");
}
var TIDC = {                 /* 型の 名まえ → 2文字。QR を 紙に のる 大きさに するため */
  acirc:"00", acirc_r:"01", aida:"02", amari:"03", at1:"04",
  at2:"05", at3:"06", at4:"07", at5:"08", at6:"09",
  ato:"0a", awase:"0b", bai:"0c", biki:"0d", bunsoku:"0e",
  chigai:"0f", circum:"0g", circum_d:"0h", coin:"0i", daikin:"0j",
  erabu:"0k", f_awase:"0l", f_nokori:"0m", fun:"0n", goukei:"0o",
  hanadan:"0p", hayasa:"0q", heikin:"0r", jikan:"0s", junban:"0t",
  kabusoku:"0u", kantan:"0v", kataho:"0w", komi:"0x", kurabe:"0y",
  mae:"0z", mashi:"10", michi:"11", morau:"12", moto:"13",
  nanpa:"14", narabe:"15", nedan:"16", nenpi:"17", nenrei:"18",
  ni_kai:"19", ni_nokori:"1a", nokori:"1b", ochi:"1c", omosa:"1d",
  oturi:"1e", para_h:"1f", perim:"1g", perim_side:"1h", rect_area:"1i",
  rect_side:"1j", rect_square:"1k", renzoku:"1l", sougo:"1m", toubun:"1n",
  tri_h:"1o", tsuku:"1p", vol5:"1q", vol5_h:"1r", wakeru:"1s",
  waru:"1t"
};
/* さいてん画面に わたす 中身。単元・演算・型・むずかしさを 入れて、分析が できるように する */
/* ぜんぶ 同じ文字なら 1文字だけ 書く（読む がわで ふくらませる） */
function same(a){
  for(var i=1;i<a.length;i++) if(a[i]!==a[0]) return a.join("");
  return a.length ? a[0] : "";
}
function sheetPayload(st,qs,sheet){
  var tags = [], nums = [], ans = [];
  qs.forEach(function(q){
    /* 計算は 印の 文字を そのまま、文章題・図形は 型を 2文字に して 短く する */
    var sub = q.sub || "";
    if(q.unit && q.unit.cat !== "calc") sub = TIDC[sub] || "";
    var tag = (q.unit ? q.unit.id : "x") + "." + (q.grade || 0)
            + (OPC[q.op] || "z") + sub;
    var i = tags.indexOf(tag);
    if(i<0){ tags.push(tag); i = tags.length-1; }
    nums.push(i);
    ans.push(plainAns(q.ans));
  });
  /* 型が 36を こえる ときは 1文字では 足りない。2文字ずつに する
     （読む がわは 長さで 見分ける） */
  var wide = tags.length > 36;
  var idx = nums.map(function(i){
    var c = i.toString(36);
    return wide ? (c.length<2 ? "0"+c : c) : c;
  });
  return ["3", st.seed, tags.join("-"), same(idx), ans.join("!"), sheetProf(st,sheet)].join("*");
}
/* 100マスは こたえが 表から 作れるので、見出しの 数だけ わたす */
function masuPayload(st,m){
  return ["2", st.seed, OPC[m.op]||"m", m.cols.join("-"), m.rows.join("-")].join("*");
}
/* ---- 英数モード用の 書き方（v4）----
   QR は 大文字・数字・記号だけなら 1字 5.5ビットで 入る（ふつうの 文字は 8ビット）。
   同じ 中身でも マス目が 1割ほど 減り、1マスが 大きく なって 見た目が 粗く なる。
   ただし 大文字に すると もどせない ので、こたえが 数字と 記号だけの ときに 限る
   （図形や 文章題は「cm」「円」が 入るので 対象外）。 */
var ALSAFE = /^[0-9.~_r-]*$/;
function sheetPayloadAl(st,qs,sheet){
  var tags = [], nums = [], ans = [], ok = true;
  qs.forEach(function(q){
    var p = plainAns(q.ans);
    if(!ALSAFE.test(p)) ok = false;
    var sub = q.sub || "";
    if(q.unit && q.unit.cat !== "calc") sub = TIDC[sub] || "";
    else sub = sub.replace(/L/g,"1").replace(/R/g,"2");   /* □の位置は 数字に 逃がす */
    var tag = ((q.unit ? q.unit.id : "x") + "." + (q.grade || 0)
             + (OPC[q.op] || "z") + sub).toUpperCase();
    var i = tags.indexOf(tag);
    if(i<0){ tags.push(tag); i = tags.length-1; }
    nums.push(i);
    ans.push(p.replace(/~/g,"/").replace(/_/g,":").replace(/r/g,"R"));
  });
  if(!ok) return "";
  var wide = tags.length > 36;
  var idx = nums.map(function(i){
    var c = i.toString(36).toUpperCase();
    return wide ? (c.length<2 ? "0"+c : c) : c;
  });
  return ["4", st.seed, tags.join("-"), same(idx), ans.join("+"),
          String(sheetProf(st,sheet)).toUpperCase()].join("*");
}
function b64url(s){
  return btoa(unescape(encodeURIComponent(s)))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
/* 生のまま 短ければ #s=、日本語が 多くて base64 の ほうが 短ければ #b= */
function payloadHash(pay){
  var raw = encodeURIComponent(pay), b = b64url(pay);
  return raw.length <= b.length + 2 ? "s=" + raw : "b=" + b;
}
/* QR は 紙に のって、よその スマホが 読む。
   だから 必ず 外から とどく URL に する。
   さいてんの ページが となりに ある と わかって いる ところだけ、
   その ページを 指す（fork や 手もとの コピーでも つながる ように）。 */
var SAITEN = "https://gaogao999.github.io/sansu-print/saiten.html";
function nearbySaiten(){
  return /^https?:$/.test(location.protocol)
    && /(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
}
function saitenBase(){
  return nearbySaiten()
    ? location.href.replace(/[?#].*$/,"").replace(/[^\/]*$/,"saiten.html")
    : SAITEN;
}
/* 1マスが 小さすぎると 家の プリンタでは にじんで 読めない。
   中身が 多い ときは QR 自体を 大きく して、1マスを 0.42mm 以上に たもつ。 */
var QRCELL = 0.36, QRMIN = 18, QRMAX = 30;
/* 書き方を いくつか 試して、マス目が いちばん 少ない ものを つかう。
   減らせない ときは 今までと 同じに なるので、悪く なる ことは ない。 */
function qrTry(level, url, alPay){
  try{
    var q = qrcode(0, level);
    if(alPay){ q.addData(saitenBase()+"#a=", "Byte"); q.addData(alPay, "Alphanumeric"); }
    else q.addData(url);
    q.make();
    return q;
  }catch(e){ return null; }
}
function qrSvg(pay, alPay){
  if(typeof qrcode!=="function" || !pay) return "";
  var url = saitenBase() + "#" + payloadHash(pay), lv = ["M","L"], i, best = null, c;
  for(i=0;i<lv.length && !best;i++){
    c = qrTry(lv[i], url, null);
    if(c) best = c;
    if(alPay){
      c = qrTry(lv[i], url, alPay);
      if(c && (!best || c.getModuleCount() < best.getModuleCount())) best = c;
    }
  }
  if(!best) return "";
  var n = best.getModuleCount();
  var mm = Math.min(QRMAX, Math.max(QRMIN, Math.ceil(n*QRCELL)));
  return '<span class="qr" style="width:'+mm+'mm;height:'+mm+'mm">'
       + best.createSvgTag({cellSize:1, margin:0, scalable:true}) + '</span>';
}
function qrTag(st,qs,sheet){
  if(!qs) return "";
  if(qs.masu) return qrSvg(masuPayload(st,qs.masu));
  if(!qs.length) return "";
  return qrSvg(sheetPayload(st,qs,sheet), sheetPayloadAl(st,qs,sheet));
}
function paper(st,inner,extraField,sheet,qs){
  var fields = "", bodyCls = sheet==="masu" ? "body center" : "body";
  var qrsvg = qrTag(st,qs,sheet);
  if(st.namerow){
    fields = '<div class="fields">'
      + '<span class="fl nm"><i>'+T("名まえ","Name")+'</i><u></u></span>'
      + '<span class="fl dt"><i>'+T("日づけ","Date")+'</i><u></u></span>'
      + '<span class="fl dt"><i>'+(extraField||T("点数","Score"))+'</i><u></u></span>'
      + '</div>';
  }
  /* QR は 右上。こたえの ぶんだけ 下の 余白が 空くので、問題が 1〜2行 増える。
     名まえ・日づけ・点数は 小さくして 題の 下に たたむ。 */
  return '<div class="wrap"><div class="paper'+(LANG==="en"?" en":"")+'">'
    + '<div class="head"><div class="t"><h2>'+esc(st.title||autoTitle())+'</h2>'
    + '<div class="tag">'+esc(hint(st))+'</div>'
    + fields + '</div>'
    + qrsvg + '</div>'
    + '<div class="'+bodyCls+'">'+inner+'</div>'
    + '<div class="foot"><span>'+T("プリント No. ","Sheet No. ")+st.seed+'</span>'
    + (qrsvg ? '<span class="qrnote">'
        + T("こたえは 右上の QR から（さいてんの 画面が ひらきます）","Scan the QR at the top right for the answer key")
        + '</span>' : '')
    + '</div>'
    + '</div></div>';
}

/* ==========================================================
   組み立てと 用紙合わせ
   ========================================================== */
function sheetKind(){
  var c = chosenUnits();
  if(!c.length) return "yoko";
  for(var i=0;i<c.length;i++) if(c[i].cat!=="calc") return "block";
  var f = allowedForms();
  if(!f.length) return "block";
  return f.indexOf(state.type)>=0 ? state.type : f[0];
}
var trimmed = false, probed = false, colCap = 0, lastQs = null;
function render(depth){
  var st = state, w = document.getElementById("warn"), stage = document.getElementById("stage");
  LANG = st.lang;
  if(!depth){ trimmed = false; probed = false; colCap = 0; }
  if(!chosenUnits().length){
    stage.innerHTML = "";
    w.textContent = "たんげんを 1つ以上 えらんでください。";
    w.hidden = false;
    return;
  }
  var sheet = sheetKind(), inner, extra = null, cols = 1, short = false, qs = [];
  if(sheet==="masu"){
    var m = makeMasu(st);
    inner = masuHTML(m);
    extra = T("タイム","Time");
    qs = {masu:m};                                 /* 100マスは 表ごと こたえを わたす */
    lastQs = null;                                 /* 1問ずつの 採点は しない */
  } else {
    qs = makeSet(st);
    short = qs.length < st.count;
    for(var i=0;i<qs.length;i++) if(qs[i].kind!=="calc"){ sheet = "block"; break; }
    if(sheet==="hissan"){
      for(i=0;i<qs.length;i++) if(!qs[i].h){ sheet = "yoko"; break; }
    }
    cols = autoCols(st,qs,sheet);
    if(colCap && cols > colCap) cols = colCap;
    lastQs = qs;
    inner = sheet==="hissan" ? hissanHTML(qs,cols)
          : sheet==="block"  ? blockHTML(qs,cols) : yokoHTML(qs,cols);
  }
  stage.innerHTML = paper(st,inner,extra,sheet,qs);
  fitTitles();
  fit();
  if(sheet!=="masu"){
    var fitres = layoutSheets(sheet,cols), d = depth||0;
    /* 式が 列の はばに 入らなかった → 列を 1つ 減らして やり直す */
    if(fitres.wide && cols > 1 && d < 12){
      colCap = cols - 1;
      return render(d+1);
    }
    if(fitres.cap && st.count > fitres.cap && d<12){
      /* 入る ところまで きっちり 入れる。選択肢の 数に 丸めると
         数問 ぶん むだに なる ので、測った 数を そのまま つかう。 */
      var fitted = fitres.cap;
      /* 行の 高さが そろわない 紙では 見つもりが ぶれる。
         かならず 1歩は 減らして、はみ出したまま 終わらない ように する。 */
      if(fitted >= st.count) fitted = st.count - Math.max(1, cols);
      if(fitted < 1) fitted = 1;
      if(fitted < st.count){
        st.count = fitted; fillCount(fitted); trimmed = true;
        return render(d+1);
      }
    }
    /* 数を 自分で えらんでいない ときは、用紙が うまるまで ふやす。
       いちばん 低い 行を もとに 強気に 見つもる。入りきらなければ
       上の しくみが きっちり 減らして くれるので、行き過ぎても 直る。 */
    if(st.countAuto && !trimmed && !short && d<10 && fitres.unitH > 0){
      var add = Math.floor(fitres.left / fitres.unitH) * cols;
      /* 見つもりで 0でも、行の 高さは 中身で 変わる ので 最後に もう1行 ためす。
         入らなければ 上の しくみが 元に もどす。 */
      if(add <= 0 && !probed){ add = cols; probed = true; }
      if(add > 0){
        st.count = st.count + add; fillCount(st.count);
        probed = false;              /* 入った なら もう1行 ためせる */
        return render(d+1);
      }
    }
  }
  if(trimmed && !short && !st.countAuto){
    w.textContent = "1まいに おさまる数に あわせて " + st.count + "問 に しました。";
    w.hidden = false;
  } else if(short){
    w.textContent = "この じょうけんでは 作れる問題が たりないので、数を へらして 出しました。";
    w.hidden = false;
  } else w.hidden = true;
  document.getElementById("seed").textContent = st.seed;
}
/* 用紙に 合わせて 行間を そろえる。はみ出す ときは 入る数を かえす */
function layoutSheets(sheet,cols){
  var papers = document.querySelectorAll(".paper"), capacity = 0, room = Infinity;
  var freeLeft = Infinity, unitH = 0, wide = false;
  var capPx = (sheet==="hissan" ? 12 : sheet==="block" ? 14 : 20) * MM;
  for(var p=0;p<papers.length;p++){
    var body = papers[p].querySelector(".body");
    var grid = body.firstElementChild;
    if(!grid) continue;
    var items = grid.children, n = items.length, i;
    if(!n) continue;
    var padTop = parseFloat(getComputedStyle(body).paddingTop) || 0;
    var usable = body.clientHeight - padTop;
    var gap = parseFloat(getComputedStyle(grid).rowGap) || 0;
    var top0 = grid.offsetTop;
    var bottom = 0, ih = 0, ihMin = Infinity;
    for(i=0;i<n;i++)
      if(items[i].scrollWidth > items[i].clientWidth + 1) wide = true;   /* 横に 入らない */
    for(i=0;i<n;i++){
      bottom = Math.max(bottom, items[i].offsetTop - top0 + items[i].offsetHeight);
      ih = Math.max(ih, items[i].offsetHeight);
      ihMin = Math.min(ihMin, items[i].offsetHeight);
    }
    if(bottom > usable + 0.5){                       /* 入りきらない */
      for(i=0;i<n;i++)
        if(items[i].offsetTop - top0 + items[i].offsetHeight > usable + 0.5) break;
      capacity = Math.max(1, i);                     /* 入る ところまでは 入れる */
      room = 0; freeLeft = 0;
      break;
    }
    var rows = Math.ceil(n/cols);
    if(sheet==="hissan" && ih){                      /* ひっ算は マスを のばす */
      var cellH = Math.min((usable - (rows-1)*gap)/rows, ih*1.8);
      grid.style.gridAutoRows = cellH + "px";
      bottom = rows*cellH + (rows-1)*gap;
    }
    /* 高さの 測りは 整数に まるめられる ので、行が 多いと 2〜3px ずれる。
       すこし 余らせて、端に ぴったり つけない。 */
    var left = Math.max(0, usable - bottom - 4);
    /* いちばん つまっている 紙に あわせて、あと 何問 入るかを 見る */
    room = Math.min(room, Math.floor((left + gap)/(ih + gap)) * cols);
    freeLeft = Math.min(freeLeft, left);
    unitH = Math.max(unitH, (ihMin===Infinity ? ih : ihMin) + gap);
    grid.style.height = "100%";
    grid.style.alignContent = "center";
    grid.style.rowGap = (rows>1 ? Math.min(gap + left/(rows-1), capPx) : gap) + "px";
  }
  return {cap:capacity, room: room===Infinity ? 0 : Math.max(0,room),
          left: freeLeft===Infinity ? 0 : Math.max(0,freeLeft), unitH:unitH, wide:wide};
}
/* iPhone は ホーム画面から 開いた アプリだと 印刷の画面が 出ない。
   iframe の 中でも 無視されることが あるので、だまって 終わらせない */
function standalone(){
  try{
    return (window.navigator && window.navigator.standalone === true) ||
           (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  }catch(e){ return false; }
}
function framed(){ try{ return window.self !== window.top; }catch(e){ return true; } }
function printNow(){
  var help = document.getElementById("printhelp"), alone = standalone();
  if(!alone){
    try{ window.print(); }catch(e){}
  }
  if(!help) return;
  help.className = alone ? "warn" : "warn soft";
  help.innerHTML = alone
    ? "ホーム画面から ひらいた ときは、iPhone では 印刷の画面が 出ません。"
      + "下の ボタンで ブラウザに うつって 印刷してください。"
    : "印刷の画面が 出てこない ときは、下の ボタンで 新しいタブに うつって ください。";
  var b = document.createElement("button");
  b.type = "button";
  b.textContent = alone ? "ブラウザで ひらく" : "新しいタブで ひらく";
  b.addEventListener("click", function(){
    try{ window.open(location.href, "_blank", "noopener"); }catch(e){}
  });
  help.appendChild(document.createElement("br"));
  help.appendChild(b);
  help.hidden = false;
}
/* だいめいが 1行に 入るまで 字を 小さくする */
function fitTitles(){
  [].forEach.call(document.querySelectorAll(".paper .head h2"), function(h){
    var size = 6.4, r = document.createRange();
    h.style.fontSize = size+"mm";
    function textW(){ r.selectNodeContents(h); return r.getBoundingClientRect().width; }
    while(textW() > h.getBoundingClientRect().width - 2 && size > 3.6){
      size -= 0.3;
      h.style.fontSize = size.toFixed(1)+"mm";
    }
  });
}
function fit(){
  var stage = document.getElementById("stage");
  var s = Math.min(1, (stage.clientWidth - 48)/(210*MM));
  if(!(s>0)) s = 1;
  stage.style.setProperty("--s", s.toFixed(4));
}

/* ==========================================================
   そうさ
   ========================================================== */
function countOptions(){
  var k = sheetKind();
  return k==="hissan" ? [3,6,9,12,15,18,21,24]
       : k==="block"  ? [2,4,6,8,10,12,14,16,20]
       : [4,6,8,10,15,20,24,30,36,42,48];
}
function fitCount(cap){
  var opts = countOptions(), best = null;
  for(var i=0;i<opts.length;i++) if(opts[i]<=cap) best = opts[i];
  return best===null ? Math.max(1,cap) : best;
}
function fillCount(exact){
  var sel = document.getElementById("count");
  var opts = countOptions().slice(), cur = state.count, best, i;
  if(exact){                       /* 用紙に 合わせて 決めた 数は そのまま つかう */
    best = exact;
    if(opts.indexOf(best)<0){ opts.push(best); opts.sort(function(a,b){ return a-b; }); }
  } else {
    best = opts[0];
    for(i=0;i<opts.length;i++) if(Math.abs(opts[i]-cur) < Math.abs(best-cur)) best = opts[i];
    if(opts.indexOf(cur)>=0) best = cur;
  }
  state.count = best;
  /* 「おまかせ」＝ 用紙が うまる 数に 自動で 合わせる。
     いま 何問に なったかも 見えるように しておく。 */
  var auto = '<option value="auto"'+(state.countAuto?" selected":"")+'>おまかせ（'+best+'問）</option>';
  sel.innerHTML = auto + opts.map(function(n){
    return '<option value="'+n+'"'+(!state.countAuto && n===best ? " selected":"")+'>'+n+'問</option>';
  }).join("");
}
function fillGrades(){
  document.getElementById("grade").innerHTML = [3,4,5,6,7].map(function(g){
    return '<button type="button" data-v="'+g+'" aria-pressed="'
      + (state.grades.indexOf(g)>=0) + '">'+GRADENAME[g].ja+'</button>';
  }).join("");
}
function fillCats(){
  document.getElementById("cat").innerHTML = CATS.map(function(c){
    return '<button type="button" data-v="'+c.id+'" aria-pressed="'
      + (state.cats.indexOf(c.id)>=0) + '">'+c.ja+'</button>';
  }).join("");
}
function fillUnits(){
  var vis = visibleUnits(), all = vis.length>0 && vis.every(function(u){ return state.units.indexOf(u.id)>=0; });
  var h = '<button type="button" class="all" data-v="*" aria-pressed="'+all+'">'
        + (all ? "ぜんぶ はずす" : "ぜんぶ えらぶ")+'</button>';
  h += vis.map(function(u){
    var gs = gradeSpan(gradesFor(u),"ja");
    return '<button type="button" data-v="'+u.id+'" aria-pressed="'+(state.units.indexOf(u.id)>=0)+'">'
         + '<i>'+gs+'</i>'+u.ja+'</button>';
  }).join("");
  document.getElementById("unit").innerHTML = h;
  var n = chosenUnits().length;
  document.getElementById("unitcount").textContent = n>1 ? n+"つ ミックス中" : "";
  var mm = document.getElementById("mixmode");
  mm.setAttribute("aria-pressed", state.mixmode ? "true":"false");
  mm.textContent = state.mixmode ? "まぜて えらぶ 中" : "まぜて えらぶ";
}
function syncUI(){
  var st = state;
  LANG = st.lang;
  /* 学年・ぶんやに 合わせて 単元を そろえる */
  var vis = visibleUnits();
  st.units = st.units.filter(function(id){
    return vis.some(function(u){ return u.id===id; });
  });
  if(!st.units.length && vis.length) st.units = [vis[0].id];
  fillGrades(); fillCats(); fillUnits();
  [].forEach.call(document.querySelectorAll("#lang button"),function(b){
    b.setAttribute("aria-pressed", b.dataset.v===st.lang ? "true":"false"); });

  var kind = sheetKind(), forms = allowedForms(), s = single();
  document.getElementById("g-form").hidden = forms.length<2;
  [].forEach.call(document.querySelectorAll("#type button"),function(b){
    var ok = forms.indexOf(b.dataset.v)>=0;
    b.disabled = !ok;
    b.setAttribute("aria-pressed", b.dataset.v===kind ? "true":"false");
  });
  var ops = allowedOps(), isMasu = kind==="masu";
  st.ops = st.ops.filter(function(o){ return ops.indexOf(o)>=0; });
  if(!st.ops.length && ops.length) st.ops = [ops[0]];
  if(isMasu) st.ops = [masuOp(st.ops)];
  document.getElementById("g-ops").hidden = ops.length===0;
  [].forEach.call(document.querySelectorAll("#ops button"),function(b){
    var ok = ops.indexOf(b.dataset.v)>=0 && !(isMasu && b.dataset.v==="/");
    b.disabled = !ok;
    b.setAttribute("aria-pressed", st.ops.indexOf(b.dataset.v)>=0 ? "true":"false");
  });
  function has(name){ return s && s.opts && s.opts.indexOf(name)>=0; }
  document.getElementById("g-digits").hidden = !has("digits") || isMasu;
  document.getElementById("g-carry").hidden  = !has("carry") || isMasu ||
    (st.ops.indexOf("+")<0 && st.ops.indexOf("-")<0);
  document.getElementById("g-div").hidden    = !has("div") || isMasu || st.ops.indexOf("/")<0;
  document.getElementById("g-dec").hidden    = !has("dec");
  document.getElementById("g-frac").hidden   = !has("frac") ||
    (st.ops.indexOf("+")<0 && st.ops.indexOf("-")<0);
  document.getElementById("g-mixed").hidden  = !has("paren");
  document.getElementById("g-neg").hidden    = !has("neg");
  document.getElementById("g-eq").hidden     = !has("eq");
  document.getElementById("g-count").hidden  = isMasu;

  if(has("digits") && (st.ops.indexOf("-")>=0 || st.ops.indexOf("/")>=0) && st.da < st.db){
    st.da = st.db;
    document.getElementById("da").value = st.da;
  }
  /* 1けた − 1けた では くり下がりが 起きない。
     「ある ものだけ」を えらんだ ときは、ひかれる数を 2けたに 上げる。 */
  if(has("carry") && st.carry==="only" && st.ops.indexOf("-")>=0 && st.da < 2){
    st.da = 2;
    document.getElementById("da").value = st.da;
  }
  var divOnly = st.ops.length===1 && st.ops[0]==="/";
  document.getElementById("lbA").textContent = divOnly ? "わられる数" : "左の数";
  document.getElementById("lbB").textContent = divOnly ? "わる数" : "右の数";

  fillCount();
  if(!st.titleDirty) document.getElementById("title").value = autoTitle();
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
/* 印刷した プリントを「さいてん」側から えらべるように 記録する */
/* 消えにくい 置き場に して もらう（できる ブラウザだけ） */
function askPersist(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return;
    navigator.storage.persisted().then(function(on){
      if(!on) navigator.storage.persist()["catch"](function(){});
    })["catch"](function(){});
  }catch(e){}
}
function saveHistory(){
  if(!lastQs || !lastQs.length || typeof localStorage==="undefined") return;
  var h = [];
  try{ h = JSON.parse(localStorage.getItem(HIST)) || []; }catch(e){ h = []; }
  if(!Array.isArray(h)) h = [];
  h.push({
    id:"s"+Date.now(), at:new Date().toISOString(), no:String(state.seed),
    title: state.title || autoTitle(), lang: state.lang, prof: sheetProf(state, sheetKind()),
    qs: lastQs.map(function(q){
      return {q: q.kind==="calc" ? q.ex : q.q, a: q.ans,
              unit: q.unit ? q.unit.id : "", unitJa: q.unit ? q.unit.ja : "",
              grade: q.grade || 0, op: q.op || "", kind: q.kind || "",
              tid: q.tid || "", sub: q.sub || ""};
    })
  });
  if(h.length>40) h = h.slice(-40);
  try{ localStorage.setItem(HIST, JSON.stringify(h)); }catch(e){}
}
/* 保存データは 何が 入っているか わからないので、通る値だけ 取り出す */
function clean(){
  var st = state, i;
  function pickOne(v,list,def){ return list.indexOf(v)>=0 ? v : def; }
  function num(v,lo2,hi2,def){ v = Math.floor(Number(v)); return (isFinite(v)&&v>=lo2&&v<=hi2) ? v : def; }
  st.grades = (Array.isArray(st.grades)?st.grades:[]).map(Number)
    .filter(function(g){ return [3,4,5,6,7].indexOf(g)>=0; });
  if(!st.grades.length) st.grades = [4];
  st.cats = (Array.isArray(st.cats)?st.cats:[]).filter(function(c){
    return CATS.some(function(x){ return x.id===c; }); });
  if(!st.cats.length) st.cats = ["calc","fig","word"];
  st.units = (Array.isArray(st.units)?st.units:[]).filter(function(id){ return !!unitOf(id); });
  st.ops = (Array.isArray(st.ops)?st.ops:[]).filter(function(x){ return "+-*/".indexOf(x)>=0 && x.length===1; });
  if(!st.ops.length) st.ops = ["+"];
  st.lang = pickOne(st.lang,["ja","en"],"ja");
  st.type = pickOne(st.type,["yoko","hissan","masu"],"yoko");
  st.divmode = pickOne(st.divmode,["exact","rem"],"exact");
  st.fd = pickOne(st.fd,["same","diff"],"diff");
  st.eqform = pickOne(st.eqform,["any","a","b"],"any");
  st.carry = pickOne(st.carry,["any","none","only"],"any");
  delete st.nocarry;
  st.cols = pickOne(String(st.cols),["auto","1","2","3"],"auto");
  st.da = num(st.da,1,4,2); st.db = num(st.db,1,4,1);
  st.dp = num(st.dp,1,2,1); st.count = num(st.count,1,120,12);
  st.seed = num(st.seed,1,99999,1234);
  ["paren","negparen","namerow","titleDirty","mixmode","countAuto"].forEach(function(k){
    st[k] = !!st[k];
  });
  st.title = typeof st.title==="string" ? st.title.slice(0,60) : "";
}
function load(){
  try{
    var raw = localStorage.getItem(STORE);
    if(!raw) return;
    var o = JSON.parse(raw);
    ["lang","type","da","db","carry","divmode","dp","fd","paren","negparen","eqform",
     "count","cols","mixmode","countAuto","title","titleDirty","namerow"].forEach(function(k){
      if(o[k]!==undefined) state[k] = o[k];
    });
    /* 前の 形（チェックボックスの nocarry）で 保存された ものを 引きつぐ */
    if(o.carry===undefined && o.nocarry===true) state.carry = "none";
    ["grades","cats","units","ops"].forEach(function(k){
      if(Array.isArray(o[k]) && o[k].length) state[k] = o[k];
    });
  }catch(e){}
  clean();
}
function applyToForm(){
  document.getElementById("da").value = state.da;
  document.getElementById("db").value = state.db;
  document.getElementById("carry").value = state.carry;
  document.getElementById("dp").value = state.dp;
  document.getElementById("fd").value = state.fd;
  document.getElementById("paren").checked = state.paren;
  document.getElementById("negparen").checked = state.negparen;
  document.getElementById("eqform").value = state.eqform;
  document.getElementById("cols").value = state.cols;
  document.getElementById("title").value = state.title;
  document.getElementById("namerow").checked = state.namerow;
  var dm = document.querySelector('input[name="dm"][value="'+state.divmode+'"]');
  if(dm) dm.checked = true;
}
function update(){ syncUI(); save(); render(); }
function toggle(arr,v,keepOne){
  var i = arr.indexOf(v);
  if(i>=0){ if(!keepOne || arr.length>1) arr.splice(i,1); }
  else arr.push(v);
  return arr;
}
function bindSelect(id,key,num){
  document.getElementById(id).addEventListener("change",function(){
    state[key] = num ? Number(this.value) : this.value; update();
  });
}
function bindCheck(id,key){
  document.getElementById(id).addEventListener("change",function(){ state[key] = this.checked; update(); });
}

/* ?g=4&u=int&o=d&n=20&da=2&db=1&dm=rem のように URL で 指定できる。
   o は 計算の えらび方（a=＋ s=－ m=× d=÷）。分析の おすすめから 飛んでくる */
function fromURL(){
  try{
    var p = new URLSearchParams(location.search), g = Number(p.get("g")), u = p.get("u");
    if([3,4,5,6,7].indexOf(g)>=0) state.grades = [g];
    var un = u && unitOf(u);
    if(un){
      state.units = [un.id];
      state.mixmode = false;
      if(state.cats.indexOf(un.cat)<0) state.cats.push(un.cat);
      if(state.grades.filter(function(x){ return un.g.indexOf(x)>=0; }).length===0)
        state.grades = [un.g[un.g.length-1]];
      /* 単元を 指定した リンクは「見立てからの 処方」。前に つかった むずかしさが
         のこって いると 中身が 変わって しまうので、いったん その単元の 既定に もどす。
         このあと URL で 指定された ものだけ 上書きする。 */
      var d = unitDefaults(un.id, state.grades[0]);
      ["ops","da","db","carry","divmode","dp","fd","paren","negparen","eqform"].forEach(function(k){
        state[k] = d[k];
      });
      if(un.forms && un.forms.indexOf(state.type)<0) state.type = un.forms[0];
    }
    var o = p.get("o"), map = {a:"+", s:"-", m:"*", d:"/"}, ops = [];
    if(o) String(o).split("").forEach(function(c){ if(map[c]) ops.push(map[c]); });
    if(ops.length) state.ops = ops;
    var n = Number(p.get("n"));  if(n>=4 && n<=60) { state.count = n; state.countAuto = false; }
    var da = Number(p.get("da")); if(da>=1 && da<=4) state.da = da;
    var db = Number(p.get("db")); if(db>=1 && db<=4) state.db = db;
    var dm = p.get("dm"); if(dm==="rem" || dm==="exact") state.divmode = dm;
    var t = p.get("t"); if(["yoko","hissan","masu"].indexOf(t)>=0) state.type = t;
    var fd = p.get("fd"); if(["same","diff","any"].indexOf(fd)>=0) state.fd = fd;
    var cy = p.get("cy"); if(["any","none","only"].indexOf(cy)>=0) state.carry = cy;
    if(g || un || o) state.titleDirty = false;
  }catch(e){}
}
document.addEventListener("DOMContentLoaded", function(){
  askPersist();
  load();
  try{ fromURL(); }catch(e){}
  applyToForm();
  /* さいてん の ページが ある ところでだけ リンクを 出す */
  var toS = document.getElementById("tosaiten");
  if(toS){ toS.href = saitenBase(); toS.hidden = false; }

  document.getElementById("grade").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    toggle(state.grades, Number(b.dataset.v), true);
    state.titleDirty = false; update();
  });
  document.getElementById("cat").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    toggle(state.cats, b.dataset.v, true);
    state.titleDirty = false; update();
  });
  document.getElementById("unit").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    if(b.dataset.v==="*"){
      var vis = visibleUnits();
      var all = vis.every(function(u){ return state.units.indexOf(u.id)>=0; });
      state.units = all ? [vis[0].id] : vis.map(function(u){ return u.id; });
      if(!all) state.mixmode = true;
    } else {
      var add = state.mixmode ? !(e.shiftKey||e.metaKey||e.ctrlKey) : (e.shiftKey||e.metaKey||e.ctrlKey);
      if(add) toggle(state.units, b.dataset.v, true);
      else state.units = [b.dataset.v];
    }
    state.titleDirty = false; update();
  });
  document.getElementById("mixmode").addEventListener("click", function(){
    state.mixmode = !state.mixmode;
    update();
  });
  document.getElementById("lang").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    state.lang = b.dataset.v; state.titleDirty = false; update();
  });
  document.getElementById("type").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b || b.disabled) return;
    state.type = b.dataset.v; state.titleDirty = false; update();
  });
  document.getElementById("ops").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b || b.disabled) return;
    if(sheetKind()==="masu") state.ops = [b.dataset.v];
    else toggle(state.ops, b.dataset.v, true);
    state.titleDirty = false; update();
  });

  bindSelect("da","da",true);
  bindSelect("db","db",true);
  bindSelect("dp","dp",true);
  bindSelect("fd","fd",false);
  bindSelect("eqform","eqform",false);
  bindSelect("carry","carry",false);
  bindCheck("paren","paren");
  bindCheck("negparen","negparen");
  bindCheck("namerow","namerow");
  [].forEach.call(document.querySelectorAll('input[name="dm"]'),function(r){
    r.addEventListener("change",function(){ state.divmode = this.value; update(); });
  });
  document.getElementById("count").addEventListener("change",function(){
    if(this.value === "auto"){
      state.countAuto = true;                      /* 用紙に 合わせて 自動で 決める */
    } else {
      state.count = Number(this.value);
      state.countAuto = false;                     /* 自分で えらんだ 数は そのまま つかう */
    }
    save(); render();
  });
  document.getElementById("cols").addEventListener("change",function(){
    state.cols = this.value; save(); render();
  });
  document.getElementById("title").addEventListener("input",function(){
    state.title = this.value;
    state.titleDirty = this.value.trim() !== "";
    save(); render();
  });
  document.getElementById("regen").addEventListener("click",function(){
    state.seed = Math.floor(Math.random()*9000)+1000; render();
  });
  document.getElementById("print").addEventListener("click",function(){
    try{ saveHistory(); }catch(e){}                /* 記録に しくじっても 印刷は 止めない */
    printNow();
  });

  window.addEventListener("resize", fit);
  update();
  /* ここで はじめて フォントを 画面にも きかせる。届かなくても 用紙は もう 出ている */
  var gf = document.getElementById("gf");
  if(gf) gf.media = "all";
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ render(); });
});
})();
