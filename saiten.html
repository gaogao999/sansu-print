<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="算数プリントの採点と記録。単元ごとの正答率から、いまの現在地と にがてな単元がわかります。">
<title>算数プリント さいてん</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" media="print"
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --desk:#EDF0F3; --desk2:#E2E7EC; --card:#FFFFFF; --line:#CFD8E1;
  --ink:#22456B; --ink2:#5B6C7E; --accent:#22456B; --accent-soft:#E4EBF3;
  --red:#D14338; --focus:#2F7FD1; --bar:#22456B; --bar-bg:#E2E7EC;
  --shadow:0 1px 2px rgba(23,42,64,.10),0 8px 24px rgba(23,42,64,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#151A20; --desk2:#1B222A; --card:#1E262F; --line:#313D49;
    --ink:#DCE6F0; --ink2:#9AAABA; --accent:#8FB6DE; --accent-soft:#25313D;
    --red:#F08076; --focus:#7FB4E8; --bar:#8FB6DE; --bar-bg:#2A343F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --desk:#151A20; --desk2:#1B222A; --card:#1E262F; --line:#313D49;
  --ink:#DCE6F0; --ink2:#9AAABA; --accent:#8FB6DE; --accent-soft:#25313D;
  --red:#F08076; --focus:#7FB4E8; --bar:#8FB6DE; --bar-bg:#2A343F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--desk);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%;
  padding-bottom:96px;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}

header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
header.top .in{max-width:760px;margin:0 auto;padding:12px 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header.top h1{margin:0;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  font-size:18px;font-weight:700;letter-spacing:.02em}
header.top a.back{margin-left:auto;font-size:12.5px;color:var(--ink2);text-decoration:none;
  border:1.5px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap}
header.top a.back:hover{border-color:var(--accent);color:var(--ink)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px}
.tabs button{
  background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 4px;
  cursor:pointer;font-size:14px;font-weight:600;transition:border-color .12s,background .12s;
}
.tabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--ink2)}
.card h2 em{font-style:normal;font-weight:400;letter-spacing:0;font-size:12px}
.muted{color:var(--ink2);font-size:12.5px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--line);background:transparent;border-radius:999px;
  padding:6px 13px;font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type="text"]{background:var(--desk2);border:1.5px solid var(--line);border-radius:9px;
  padding:8px 10px;font-size:14px;min-width:0;flex:1 1 120px}
.btn{border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:700;
  border:1.5px solid var(--accent);background:transparent;color:var(--accent)}
.btn.fill{background:var(--accent);color:var(--card)}
.btn.ghost{border-color:var(--line);color:var(--ink2);font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* プリントを えらぶ */
.sheets{display:flex;flex-direction:column;gap:8px}
.sheet{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;background:transparent;cursor:pointer;text-align:left;width:100%}
.sheet[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sheet b{font-size:14.5px;font-weight:700;display:block}
.sheet span{font-size:12px;color:var(--ink2)}
.sheet .no{margin-left:auto;font-size:12px;color:var(--ink2);white-space:nowrap;
  font-variant-numeric:tabular-nums}

/* まるつけ */
.marks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mark{
  display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;
  padding:8px 10px;background:transparent;cursor:pointer;text-align:left;min-height:52px;
}
.mark .n{font-size:11.5px;color:var(--ink2);flex:0 0 auto;font-variant-numeric:tabular-nums}
.mark .a{flex:1 1 auto;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark .a .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  font-size:.72em;line-height:1.1}
.mark .a .fr i{font-style:normal;border-top:1px solid currentColor;padding:0 2px}
.mark .a .fr b{font-weight:400;padding:0 2px}
.mark .a .mx{display:inline-flex;align-items:center;gap:2px}
.mark .st{flex:0 0 auto;font-size:20px;line-height:1;width:26px;text-align:center}
.mark.ok{border-color:var(--line)}
.mark.ok .st{color:var(--ink2)}
.mark.ng{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent)}
.mark.ng .st{color:var(--red);font-weight:700}
.mark.ng .a{color:var(--red)}

/* 写真 */
.photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo img{width:88px;height:88px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
label.file{border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:700;
  border:1.5px solid var(--line);color:var(--ink2)}
label.file input{display:none}

/* 下の 固定バー */
.bottom{
  position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:10;
}
.bottom .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bottom .sc{font-size:14px;font-weight:700;white-space:nowrap}
.bottom .sc small{display:block;font-size:11.5px;font-weight:400;color:var(--ink2)}
.bottom .btn{margin-left:auto}

/* 分析 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-size:24px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;color:var(--ink2)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.bar .nm{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .nm i{font-style:normal;font-size:11px;color:var(--ink2);margin-right:5px}
.bar .vl{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .vl small{color:var(--ink2);font-size:11.5px;margin-left:4px}
.bar .track{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--bar-bg);overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--bar)}
.bar .tag{font-size:11px;font-weight:700;color:var(--red);border:1px solid var(--red);
  border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.empty{text-align:center;color:var(--ink2);font-size:13px;padding:26px 10px;line-height:1.8}
.advice{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:ad}
.advice li{counter-increment:ad;border-left:3px solid var(--line);padding:2px 0 2px 12px}
.advice li.base{border-left-color:var(--red)}
.advice li.weak{border-left-color:var(--accent)}
.advice li.good{border-left-color:var(--line)}
.advice li.care{border-left-color:var(--accent);border-left-style:dashed}
.advice li b{display:block;font-size:15px;line-height:1.5}
.advice li b::before{content:counter(ad) ". ";color:var(--ink2);font-weight:400}
.advice li p{margin:5px 0;font-size:12.5px;color:var(--ink2);line-height:1.75}
.advice li p span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  color:var(--ink2);opacity:.75;margin-bottom:1px}
.advice li p.obs{color:var(--ink)}
.advice li p.todo{color:var(--ink)}
.advice li p.todo span{color:var(--accent);opacity:1}
.advice li.base p.todo span{color:var(--red)}
.advice li b i.soft{display:inline-block;font-style:normal;font-size:10.5px;font-weight:600;
  margin-left:7px;padding:1px 7px;border:1px solid var(--line);border-radius:20px;
  color:var(--ink2);vertical-align:2px}
.advice li a{margin-top:4px}
.lead{margin:0 0 10px;font-size:13.5px;line-height:1.8;color:var(--ink)}
.advice li a{display:inline-block;text-decoration:none;border:1.5px solid var(--accent);color:var(--accent);
  border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700}
.advice li.base a{border-color:var(--red);color:var(--red)}
.note{font-size:12px;color:var(--ink2);line-height:1.7;margin:10px 0 0;
  border-top:1px solid var(--line);padding-top:9px}

/* きろく */
.recs{display:flex;flex-direction:column;gap:8px}
.rec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.rec img{width:44px;height:44px;object-fit:cover;border-radius:7px;border:1px solid var(--line);flex:0 0 auto}
.rec .t{flex:1 1 auto;min-width:0}
.rec .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .t span{font-size:11.5px;color:var(--ink2)}
.rec .p{flex:0 0 auto;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.rec .del{flex:0 0 auto;background:none;border:none;color:var(--ink2);font-size:17px;cursor:pointer;padding:4px}
.hide{display:none}

/* 現在地 */
.here{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  border-radius:12px;padding:14px 16px;background:var(--accent-soft);margin:2px 0 12px}
.here b{font-size:30px;line-height:1;letter-spacing:.02em}
.here span{font-size:14px;color:var(--ink2)}
.here.thin{background:var(--desk2)}
.here.thin b{font-size:20px}
.ladder{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.lv{display:grid;grid-template-columns:38px 60px 1fr 44px;grid-template-areas:"g s bar pc" ". . sub sub";
  align-items:center;gap:2px 8px;padding:5px 0}
.lv .g{grid-area:g;font-size:14px;font-weight:700;color:var(--ink2)}
.lv .stt{grid-area:s;font-size:11px;font-weight:700;text-align:center;
  border:1px solid var(--line);border-radius:20px;padding:2px 0;color:var(--ink2)}
.lv .bar{grid-area:bar;height:9px;border-radius:20px;background:var(--desk2);overflow:hidden}
.lv .bar i{display:block;height:100%;border-radius:20px;background:var(--line)}
.lv .pc{grid-area:pc;font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.lv .sub{grid-area:sub;font-size:11px;color:var(--ink2)}
.lv.pass .g,.lv.pass .pc{color:var(--accent)}
.lv.pass .stt{border-color:var(--accent);color:var(--accent)}
.lv.pass .bar i{background:var(--accent)}
.lv.near .bar i,.lv.work .bar i{background:var(--accent);opacity:.55}
.lv.thin .bar i{background:var(--line)}
.lv.none{opacity:.45}
.lv.now .g{color:var(--ink);font-size:15px}
.lv.now .stt{border-width:1.5px;border-color:var(--ink);color:var(--ink)}
.tiles.small .tile b{font-size:19px}
.tiles.small .tile b span{font-size:12px}

.bkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bkrow .btn{flex:1 1 160px}
.bkrow .file{flex:1 1 160px;display:flex;align-items:center;justify-content:center;text-align:center}

/* QR から とどいた とき */
.qrhit{border-color:var(--accent)}
.qrhit h2{color:var(--accent)}
.masuwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.masu{border-collapse:collapse;font-variant-numeric:tabular-nums;margin:2px 0}
table.masu th,table.masu td{border:1px solid var(--line);padding:5px 7px;text-align:center;
  font-size:13px;min-width:30px}
table.masu th{background:var(--accent-soft);font-weight:600}
table.masu tbody th{background:var(--accent-soft)}
table.masu td{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>算数プリント さいてん</h1>
  <a class="back" href="./index.html">プリントを つくる →</a>
</div></header>

<div class="wrap">
  <div class="tabs" id="tabs">
    <button type="button" data-v="mark" aria-pressed="true">さいてん</button>
    <button type="button" data-v="log"  aria-pressed="false">きろく</button>
    <button type="button" data-v="ana"  aria-pressed="false">分析</button>
  </div>
  <div id="view"></div>
</div>

<div class="bottom hide" id="bottom"><div class="in">
  <div class="sc" id="score">－<small>まる の 数</small></div>
  <button type="button" class="btn fill" id="save">記録する</button>
</div></div>
<script>
(function(){
"use strict";
var HIST = "sansu-print-history-v1";     /* プリントを つくった 記録（つくる側が 書く） */
var SAI  = "sansu-saiten-v1";            /* 採点の 記録（この画面が 書く） */

/* ---------- 入れもの ---------- */
function readJSON(key,def){
  try{ var v = JSON.parse(localStorage.getItem(key)); return v || def; }catch(e){ return def; }
}
function writeJSON(key,val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; }
}
function sheets(){
  var a = readJSON(HIST,[]);
  return Array.isArray(a) ? a.filter(function(s){ return s && s.qs && s.qs.length; }) : [];
}
function store(){
  var s = readJSON(SAI,{kids:[],records:[]});
  if(!Array.isArray(s.kids)) s.kids = [];
  if(!Array.isArray(s.records)) s.records = [];
  return s;
}
/* 写真を 入れると 場所を 食うので、古いものから 写真だけ 落とす */
function saveStore(s){
  if(writeJSON(SAI,s)) return true;
  var i, rec = s.records.slice().sort(function(a,b){ return a.at < b.at ? -1 : 1; });
  for(i=0;i<rec.length;i++){
    if(rec[i].photo){ delete rec[i].photo; if(writeJSON(SAI,s)) return true; }
  }
  return writeJSON(SAI,s);
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function fmtDate(iso){
  var d = new Date(iso);
  if(isNaN(d)) return "";
  var p = function(n){ return (n<10?"0":"")+n; };
  return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" "+d.getHours()+":"+p(d.getMinutes());
}
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }

/* ---------- 紙の QR から こたえを うけとる ----------
   プリントの QR は #s=（そのまま）か #b=（base64）で 中身を つれてくる。
   1*seed*単元*問ごとの単元番号*問ごとの演算*こたえ!こたえ!…
   2*seed*演算*よこの数*たての数            （100マス）              */
var OPC = {a:"+", s:"-", m:"*", d:"/", z:""};
var OPSIGN = {"+":"＋","-":"－","*":"×","/":"÷"};
var GN = {3:"小3", 4:"小4", 5:"小5", 6:"小6", 7:"中1", 8:"中2"};
function showAns(a){
  return String(a).replace(/(\d)~(\d)/g,"$1/$2")
                  .replace(/(\d)r(\d)/g,"$1 あまり $2")
                  .replace(/_/g," ");
}
function qrTitle(units){
  var gs = [], ns = [], i, u, d;
  for(i=0;i<units.length;i++){
    u = units[i]; d = u.lastIndexOf(".");
    var id = d>0 ? u.slice(0,d) : u, g = d>0 ? +u.slice(d+1) : 0;
    if(GN[g] && gs.indexOf(GN[g])<0) gs.push(GN[g]);
    var nm = (U[id] && U[id].ja) || "";
    if(nm && ns.indexOf(nm)<0) ns.push(nm);
  }
  var t = (gs.length>2 ? "学年ミックス" : gs.join("・"))
        + " " + (ns.slice(0,2).join("・") + (ns.length>2 ? " ほか" : ""));
  return t.trim() || "プリント";
}
function decodeHash(){
  var m = /[#&](s|b|a)=([^&]+)/.exec(location.hash || "");
  if(!m) return null;
  var pay;
  try{
    pay = m[1]==="s" ? decodeURIComponent(m[2])
        : m[1]==="a" ? m[2]                       /* 英数モード。そのまま 読む */
        : decodeURIComponent(escape(atob(m[2].replace(/-/g,"+").replace(/_/g,"/"))));
  }catch(e){ return null; }
  /* v4（英数モード）は 大文字で 書いて ある。小文字に もどして v3 と 同じに 扱う。
     こたえの / : R は もとの ~ _ r に もどす。 */
  var wasAl = false;
  if(pay.charAt(0)==="4"){
    var g4 = pay.split("*");
    if(g4.length<5) return null;
    wasAl = true;
    g4[0] = "3";
    g4[2] = g4[2].toLowerCase();
    g4[3] = g4[3].toLowerCase();
    g4[4] = g4[4].split("+").map(function(x){
      return x.replace(/R/g,"r").replace(/:/g,"_").replace(/\//g,"~");
    }).join("!");
    g4[5] = (g4[5]||"").toLowerCase();
    pay = g4.join("*");
  }
  var f = pay.split("*");
  if(f[0]==="2" && f.length>=5){
    var op = OPC[f[2]] || "*";
    var num = function(a){ return a.split("-").map(Number).filter(function(n){
      return isFinite(n) && n>=0 && n<=999; }).slice(0,20); };
    if(!num(f[3]).length || !num(f[4]).length) return null;
    return {masu:{op:op, cols:num(f[3]), rows:num(f[4])},
            id:"q"+f[1], no:f[1], at:new Date().toISOString(),
            title:"100マス計算（"+OPSIGN[op]+"）", qs:[]};
  }
  /* v3: 3*No.*型のならび*問ごとの番号*こたえ*むずかしさ
     v1: 1*No.*単元*問ごとの番号*演算*こたえ（前に 刷った プリント）  */
  var v3 = f[0]==="3" && f.length>=5, v1 = f[0]==="1" && f.length>=6;
  if(!v3 && !v1) return null;
  var tags = f[2].split("-"), idx = f[3];
  var ans = (v3 ? f[4] : f[5]).split("!").slice(0,200);
  var ops = v1 ? f[4] : "", prof = v3 ? (f[5]||"") : "";
  var out = [], i, units = [];
  if(!/^[a-z0-9]{0,8}$/.test(prof)) prof = "";
  /* 型の 番号は 1問1文字。型が 36を こえる ときだけ 2文字ずつ。
     ぜんぶ 同じなら 1文字だけ 書いて ある。 */
  var wide = idx.length === ans.length*2 && ans.length>1;
  var at = function(i){
    if(idx.length===1) return parseInt(idx,36);
    return wide ? parseInt(idx.substr(i*2,2),36) : parseInt(idx.charAt(i),36);
  };
  for(i=0;i<ans.length;i++){
    var key = tags[at(i)] || "";
    var d = key.indexOf("."), id = d>0 ? key.slice(0,d) : key;
    var rest = d>0 ? key.slice(d+1) : "";
    var g = +rest.charAt(0) || 0;
    var op = v3 ? (OPC[rest.charAt(1)] || "") : (OPC[ops.length===1 ? ops : ops.charAt(i)] || "");
    var sub = v3 ? rest.slice(2) : "";
    if(!U[id]) id = "";                                   /* 知らない単元は 捨てる */
    if(!(g>=3 && g<=7)) g = 0;
    if(id && U[id].c!=="calc") sub = TIDN[sub] || "";     /* 2文字の 型コードを もどす */
    else {
      if(wasAl) sub = sub.replace(/1/g,"L").replace(/2/g,"R");   /* □の位置を もどす */
      if(!/^[A-Za-z]{0,6}$/.test(sub)) sub = "";
    }
    if(units.indexOf(id+"."+g)<0) units.push(id+"."+g);
    out.push({q:"", a:esc(showAns(ans[i])), unit:id, unitJa:(U[id] && U[id].ja) || "",
              grade:g, op:op, kind:(U[id] && U[id].c) || "", tid:sub, sub:sub});
  }
  if(!out.length) return null;
  return {id:"q"+f[1], no:f[1], at:new Date().toISOString(),
          title:qrTitle(units), prof:prof, qs:out};
}
/* QR から 来た ときの 受けとり。ひらいたときと、あとから 読んだとき の 両方 */
function takeHash(){
  var q = decodeHash();
  if(!q) return false;
  if(q.masu){
    qrMasu = q.masu; sel = null; marks = [];
    qrNote = q.title + " の こたえです。";
  } else {
    var got = mergeSheet(q);
    qrMasu = null; sel = got; marks = got.qs.map(function(){ return 1; }); photo = null;
    qrNote = "No." + q.no + "　" + q.title + "（" + q.qs.length + "問）";
  }
  tab = "mark";
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  return true;
}
/* とどいた プリントを 記録に まぜる（同じ No. は 1つだけ） */
function mergeSheet(sh){
  var a = readJSON(HIST,[]);
  if(!Array.isArray(a)) a = [];
  var i;
  for(i=0;i<a.length;i++) if(a[i] && a[i].id===sh.id) return a[i];
  a.push(sh);
  if(a.length>40) a = a.slice(-40);
  writeJSON(HIST,a);
  return sh;
}
function masuTable(m){
  var h = '<table class="masu"><thead><tr><th>'+esc(OPSIGN[m.op]||m.op)+'</th>', r, c, x, y;
  for(c=0;c<m.cols.length;c++) h += '<th>'+esc(m.cols[c])+'</th>';
  h += '</tr></thead><tbody>';
  for(r=0;r<m.rows.length;r++){
    h += '<tr><th>'+esc(m.rows[r])+'</th>';
    for(c=0;c<m.cols.length;c++){
      /* 紙と 同じ 向きで 計算する（左の 数 − 上の 数）。
         ＋と×は 入れかえても 同じだが、−は 逆に なる。 */
      x = Number(m.rows[r]); y = Number(m.cols[c]);
      h += '<td>'+(m.op==="+" ? x+y : m.op==="-" ? x-y : x*y)+'</td>';
    }
    h += '</tr>';
  }
  return h+'</tbody></table>';
}

/* ---------- データを 守る ----------
   ブラウザの おぼえた ものは、空きが 足りない ときや
   しばらく つかわない ときに 消える ことが ある。
   だから「ファイルに 書き出す」を 用意して、そこが 本ものの 置き場に なる。 */
var BK = "sansu-saiten-backup-v1";
function lastBackup(){
  try{ return localStorage.getItem(BK) || ""; }catch(e){ return ""; }
}
function backupCard(s){
  var last = lastBackup(), n = s.records.length;
  var since = 0, i;
  for(i=0;i<s.records.length;i++) if(!last || s.records[i].at > last) since++;
  var warn = n>0 && (!last || since>=10);
  return '<div class="card'+(warn?' qrhit':'')+'"><h2>データを まもる</h2>'
    + '<p class="muted">記録は この 端末の ブラウザに おぼえています。'
    + 'ブラウザの データを 消したり、しばらく つかわないと 消える ことが あります。'
    + 'ときどき ファイルに 書き出して おいて ください。</p>'
    + '<p class="muted">いまの 記録 '+n+'件'
    + (last ? '　/　さいごの 書き出し '+fmtDate(last)+(since?'（そのあと '+since+'件）':'（そのあとの 追加なし）')
            : '　/　まだ 一度も 書き出して いません')
    + (persistOK===true ? '　/　この端末では 消えにくい 設定に なっています' : '')
    + '</p>'
    + '<div class="bkrow">'
    + '<button type="button" class="btn fill" id="expjson">ファイルに 書き出す</button>'

    + '</div></div>';

function stamp(name){

/* 読みこみは 足し算。同じ id の ものは 入れない（消さない・上書きしない） */
function importJSON(text){
  var d;
  try{ d = JSON.parse(text); }catch(e){ return {err:"ファイルを 読めませんでした。"}; }
  if(!d || (!Array.isArray(d.records) && !Array.isArray(d.sheets)))
    return {err:"この ファイルには 記録が 入っていません。"};
  var s = store(), have = {}, addR = 0, addS = 0, addK = 0, i;
  s.records.forEach(function(r){ have[r.id] = 1; });
  (d.records||[]).forEach(function(r){
    if(!r || !r.id || have[r.id] || !Array.isArray(r.perQ)) return;
    have[r.id] = 1; s.records.push(r); addR++;
  });
  s.records.sort(function(a,b){ return a.at < b.at ? -1 : a.at > b.at ? 1 : 0; });
  if(s.records.length>400) s.records = s.records.slice(-400);
  (d.kids||[]).forEach(function(k){
    if(typeof k==="string" && k && s.kids.indexOf(k)<0){ s.kids.push(k); addK++; }
  });
  if(!saveStore(s)) return {err:"この端末に 保存できませんでした（空きが たりません）。"};
  var h = readJSON(HIST,[]); if(!Array.isArray(h)) h = [];
  var hh = {}; h.forEach(function(x){ if(x && x.id) hh[x.id] = 1; });
  (d.sheets||[]).forEach(function(x){
    if(!x || !x.id || hh[x.id] || !Array.isArray(x.qs)) return;
    hh[x.id] = 1; h.push(x); addS++;
  });
  if(h.length>60) h = h.slice(-60);
  writeJSON(HIST,h);
  return {r:addR, s:addS, k:addK};
}

}

var TIDC = {                 /* 型の 名まえ → 2文字。QR を 紙に のる 大きさに するため */

var TIDN = {}; for(var _t in TIDC) if(TIDC.hasOwnProperty(_t)) TIDN[TIDC[_t]] = _t;

function rate(x){ return x.n ? Math.round(x.ok/x.n*100) : 0; }
function nameOf(id){ return (U[id] && U[id].ja) || id; }
function isCalc(id){ return !U[id] || U[id].c==="calc"; }
/* すすめる 問題数は、その 単元の 出しかたで 実際に えらべる 数に あわせる */
function nFor(id){ return (U[id] && U[id].c==="calc") ? 20 : 12; }
function linkTo(id, g, extra){
  var u = U[id]; if(!u) return null;
  var gg = g && u.g.indexOf(g)>=0 ? g : u.g[u.g.length-1];
  return "./index.html?g="+gg+"&u="+encodeURIComponent(id)+(extra||"");
}
/* プリントの むずかしさ（h32r＝ひっ算・3けたと2けた・あまりあり）を 日本語に */
function profJa(p){
  if(!p) return "";
  var m = /^([a-z])(\d)(\d)([rnot]*)$/.exec(String(p));
  if(!m) return "";
  var bits = [], t = {y:"よこ式", h:"ひっ算", b:"", m:"100マス"}[m[1]];
  if(t) bits.push(t);
  if(+m[2] && +m[3]) bits.push(m[2]+"けたと "+m[3]+"けた");
  if(m[4].indexOf("r")>=0) bits.push("あまりあり");
  if(m[4].indexOf("n")>=0) bits.push("くり上がりなし");
  if(m[4].indexOf("o")>=0) bits.push("くり上がりあり");
  if(m[4].indexOf("t")>=0) bits.push("分母ちがい");
  return bits.join("・");
}

/* 学年を またいで 単元ごとに まとめる。
   演算（＋－×÷）の 集計は 整数と 虫食い算だけ。分数の × などを 混ぜると
   「かけ算が 弱い」と 見まちがえるため。 */
function rollup(recs){
  var byU = {}, byOp = {}, seq = {}, qs = {};
  recs.forEach(function(r){
    (r.perQ||[]).forEach(function(q){
      var u = byU[q.unit] || (byU[q.unit] = {n:0, ok:0, ja:q.unitJa||(U[q.unit]&&U[q.unit].ja)||q.unit, g:q.grade});
      u.n++; if(q.ok) u.ok++; if(q.grade>u.g) u.g = q.grade;
      (seq[q.unit] || (seq[q.unit] = [])).push(q.ok ? 1 : 0);
      (qs[q.unit] || (qs[q.unit] = [])).push({ok:q.ok, sub:q.sub||"", op:q.op||"", prof:r.prof||""});
      if(q.op && (q.unit==="int" || q.unit==="hole")){
        var o = byOp[q.op] || (byOp[q.op] = {n:0, ok:0});
        o.n++; if(q.ok) o.ok++;
      }
    });
  });
  return {byU:byU, byOp:byOp, seq:seq, qs:qs};
}
function trend(list){
  if(list.length < 12) return null;
  var h = Math.floor(list.length/2), a = list.slice(0,h), b = list.slice(h);
  var f = function(x){ return Math.round(x.reduce(function(p,q){return p+q;},0)/x.length*100); };
  return {from:f(a), to:f(b)};
}

/* ==========================================================
   どの「型」で 割れているか
   正答率だけでは「何が できていないか」は 言えない。
   同じ単元の 中で、くり上がりの ある/なし、通分の 要る/要らない…
   と 2つに 割って くらべ、はっきり 差が つく ところを 探す。
   ========================================================== */
var FEATU = {                               /* 単元に よって 言い方を 変える */
  dec:{ w:{l:"小数を かける・小数で わる", s:"小数×小数・小数÷小数"} },
  int:{ w:{l:"かける数・わる数が 2けた",   s:"2けたを かける・わる", u:"&db=2"} },
  hole:{w:{l:"かける数・わる数が 2けた",   s:"2けたを かける・わる", u:"&db=2"} },
  dfmix:{ d:{l:"小数が まざる",            s:"小数を 分数に なおす"} },
  bignum:{g:{l:"10倍・100倍・1000倍",      s:"10倍・100倍"},
          d:{l:"1/10・1/100",              s:"1/10・1/100"},
          k:{l:"何こ あつめた 数か",        s:"位ごとの まとまり"} },
  daihyo:{c:{l:"平均値",                   s:"平均値"},
          n:{l:"中央値（ならべかえ）",      s:"中央値"},
          m:{l:"最頻値",                   s:"最頻値"} },
  prime:{ t:{l:"素数 2つの 積",            s:"素因数 2つ"},
          g:{l:"素数 3つ以上の 積",         s:"素因数 3つ以上"} }
};
function featOf(id,c){ return (FEATU[id] && FEATU[id][c]) || FEAT[c]; }
function splitOf(list, id){
  var best = null, i;
  if(isCalc(id)){
    var seen = {};
    list.forEach(function(q){ q.sub.split("").forEach(function(c){ if(FEAT[c]) seen[c] = 1; }); });
    Object.keys(seen).forEach(function(c){
      var a = {n:0,ok:0}, b = {n:0,ok:0};
      list.forEach(function(q){ var t = q.sub.indexOf(c)>=0 ? a : b; t.n++; if(q.ok) t.ok++; });
      if(a.n<MINSP || b.n<MINSP) return;
      var gap = rate(b) - rate(a);
      if(gap>=GAP && rate(a)<OK && (!best || gap>best.gap)){
        var F = featOf(id,c);
        best = {l:F.l+"もの", s:F.s, url:F.u||"", other:"そうでない もの", gap:gap, hard:a, easy:b};
      }
    });
    return best;
  }
  var g = {};
  list.forEach(function(q){ if(!q.sub || !TID[q.sub]) return;
    var t = g[q.sub] || (g[q.sub] = {n:0,ok:0}); t.n++; if(q.ok) t.ok++; });
  var ks = Object.keys(g).filter(function(k){ return g[k].n>=MINSP; });
  if(ks.length<2) return null;
  ks.sort(function(x,y){ return rate(g[x]) - rate(g[y]); });
  var lo = ks[0], hi = ks[ks.length-1];
  if(rate(g[lo])>=OK || rate(g[hi])-rate(g[lo])<GAP) return null;
  return {l:"「"+TID[lo]+"」型", s:"「"+TID[lo]+"」型", url:"",
          other:"「"+TID[hi]+"」型", gap:rate(g[hi])-rate(g[lo]), hard:g[lo], easy:g[hi]};
}
/* けた数など、プリントの 設定で 割れているか */
function wallOf(list){
  var g = {};
  list.forEach(function(q){ if(!profJa(q.prof)) return;
    var t = g[q.prof] || (g[q.prof] = {n:0,ok:0}); t.n++; if(q.ok) t.ok++; });
  var ks = Object.keys(g).filter(function(k){ return g[k].n>=MINSP+2; });
  if(ks.length<2) return null;
  ks.sort(function(x,y){ return rate(g[x]) - rate(g[y]); });
  var lo = ks[0], hi = ks[ks.length-1];
  if(rate(g[lo])>=OK || rate(g[hi])-rate(g[lo])<GAP) return null;
  return {hard:profJa(lo), easy:profJa(hi), hardR:rate(g[lo]), easyR:rate(g[hi]),
          hardN:g[lo].n, easyN:g[hi].n};
}
/* 1枚の 後半で 落ちて いないか（集中・時間の 話。理解とは 分けて 見る）
   後半に 難しい型が かたまって いると、前半後半を そのまま くらべては いけない。
   同じ型の 中で 前半と 後半の 差を 出し、それを 重みつきで ならす。 */
function stamina(recs){
  var by = {};
  recs.forEach(function(r){
    var q = r.perQ || [];
    if(q.length<8) return;
    var h = Math.floor(q.length/2);
    q.forEach(function(x,i){
      var k = x.unit + "/" + (x.sub||"");
      var v = by[k] || (by[k] = {fn:0, fo:0, bn:0, bo:0});
      if(i<h){ v.fn++; if(x.ok) v.fo++; } else { v.bn++; if(x.ok) v.bo++; }
    });
  });
  var num = 0, den = 0, fN = 0, fO = 0, bN = 0, bO = 0;
  Object.keys(by).forEach(function(k){
    var v = by[k], w;
    if(v.fn<3 || v.bn<3) return;                       /* 前後 どちらにも 3問以上 ある型だけ */
    w = Math.min(v.fn, v.bn);
    num += w * (v.fo/v.fn - v.bo/v.bn);
    den += w;
    fN += v.fn; fO += v.fo; bN += v.bn; bO += v.bo;
  });
  if(den<10 || fN<15 || bN<15) return null;
  var d = Math.round(num/den*100);
  return d>=15 ? {front:Math.round(fO/fN*100), back:Math.round(bO/bN*100), n:fN+bN, gap:d} : null;
}

/* ==========================================================
   現在地（レベル）
   正答率だけで「その学年は 通過」とは 言わない。
   単元を いくつ ためしたか も 見る。2単元 90%は「通過」では なく
   「まだ ためして いない ところが 多い」だけ。
   ========================================================== */
var LVN = {pass:"通過", near:"あと 少し", work:"練習中", thin:"ためし中", none:"まだ"};
function unitsOfGrade(g){
  return Object.keys(U).filter(function(id){ return U[id].g.indexOf(g)>=0; });
}
function levelOf(recs){
  var by = {};
  recs.forEach(function(r){ (r.perQ||[]).forEach(function(q){
    if(!GRN[q.grade]) return;
    var x = by[q.grade] || (by[q.grade] = {n:0, ok:0, u:{}});
    x.n++; if(q.ok) x.ok++;
    if(q.unit) x.u[q.unit] = (x.u[q.unit]||0) + 1;
  }); });
  var rows = [3,4,5,6,7,8].map(function(g){
    var all = unitsOfGrade(g), x = by[g];
    if(!x) return {g:g, st:"none", n:0, ok:0, r:0, tried:0, all:all.length, rest:all};
    var tried = Object.keys(x.u).filter(function(id){ return x.u[id]>=3; });
    /* 「通過」と 言うには、点だけで なく その学年の 単元を ひととおり
       さわって いる ことが 要る。2単元 90%は 通過では ない。 */
    var r = rate(x), st, need = Math.max(3, Math.ceil(all.length*0.4));
    if(x.n<12 || tried.length<Math.min(2,all.length)) st = "thin";
    else if(r>=HIGH && tried.length>=Math.min(need,all.length)) st = "pass";
    else if(r>=HIGH) st = "thin";                 /* 点は いいが ためした 範囲が せまい */
    else if(r>=OK) st = "near";
    else st = "work";
    return {g:g, st:st, n:x.n, ok:x.ok, r:r, tried:tried.length, all:all.length,
            rest:all.filter(function(id){ return !x.u[id]; })};
  });
  var passed = rows.filter(function(z){ return z.st==="pass"; }).map(function(z){ return z.g; });
  var now = null, i;
  for(i=0;i<rows.length;i++) if(rows[i].n>0 && rows[i].st!=="pass"){ now = rows[i].g; break; }
  if(now===null && passed.length) now = Math.min(7, passed[passed.length-1]+1);
  return {rows:rows, passed:passed, now:now,
          row:function(g){ return rows.filter(function(z){ return z.g===g; })[0]; }};
}
/* 現在地を ひとことで */
function levelLine(L, total){
  var now = L.now, row = now ? L.row(now) : null, bits = [];
  if(L.passed.length)
    bits.push(L.passed.map(function(g){ return GRN[g]; }).join("・")+"は 通過して います");
  if(row){
    if(row.st==="none")
      bits.push(GRN[now]+"は まだ 1問も といて いません");
    else if(row.st==="thin" && row.r>=HIGH && row.n>=12)
      bits.push(GRN[now]+"は といた ぶんでは "+row.r+"%と よく できて います。"
        + "ただ "+row.all+"単元のうち "+row.tried+"単元しか ためして いないので、"
        + "まだ 「通過」とは 言えません");
    else if(row.st==="thin")
      bits.push(GRN[now]+"は まだ "+row.n+"問（"+row.tried+"単元）なので、これから 見えて きます");
    else
      bits.push("いま "+GRN[now]+"の とちゅうで、"+row.all+"単元のうち "+row.tried
        +"単元を ためして "+row.r+"%");
  }
  if(!bits.length) bits.push("といた 問題は "+total+"問");
  return bits.join("。") + "。";
}

/* ==========================================================
   見立て
   ならべる 順は「土台が 先」。
   1 整数の ＋−×÷ の 穴 → 2 前提の さかのぼり → 3 型の 割れ
   → 4 けたの 壁 → 5 後半で 落ちる → 6 のび → 7 まだの 単元
   それぞれ「見えたこと（数）→ どう 読むか → 何を するか」で 書く。
   ========================================================== */
function advise(recs){
  var R = rollup(recs), byU = R.byU, byOp = R.byOp, QS = R.qs;
  var out = [], done = {}, ids = Object.keys(byU), total = 0;
  ids.forEach(function(id){ total += byU[id].n; });
  function ok(id){ return byU[id] && byU[id].n>=MIN; }
  function shaky(id){ return ok(id) && rate(byU[id])<OK; }
  function thin(id){ return byU[id] && byU[id].n<SURE; }
  function push(it){ if(!done[it.key]){ done[it.key]=1; out.push(it); } }
  /* 手前を たどって、いちばん 奥の あやしい ところ */
  function root(id, depth){
    var pres = PRE[id] || [], i;
    if(depth>4) return null;
    for(i=0;i<pres.length;i++){ if(shaky(pres[i])) return root(pres[i], depth+1) || pres[i]; }
    return null;
  }
  function firstUntouched(id){
    var pres = PRE[id] || [], i;
    for(i=0;i<pres.length;i++) if(!byU[pres[i]]) return pres[i];
    return null;
  }
  /* 単元の 中の 型の 割れを ひとこと に する */
  function splitLine(id){
    var sp = splitOf(QS[id]||[], id);
    if(!sp) return null;
    sp.text = "とくに "+sp.l+"で "+rate(sp.hard)+"%（"+sp.hard.ok+"/"+sp.hard.n+"問）。"
      + sp.other+"は "+rate(sp.easy)+"%（"+sp.easy.ok+"/"+sp.easy.n+"問）。";
    sp.clean = rate(sp.easy) >= HIGH;      /* かんたんな 側が とれて いれば 土台は 無事 */
    return sp;
  }
  function sheetFor(id, sp){
    return linkTo(id, byU[id] && byU[id].g, "&n="+nFor(id)+((sp && sp.url) || ""));
  }

  /* 1) 整数の ＋−×÷ の うち 1つだけ 落ちていないか */
  var ops = Object.keys(byOp).filter(function(o){ return byOp[o].n>=MINOP; });
  if(ops.length>=2){
    ops.sort(function(a,b){ return rate(byOp[a]) - rate(byOp[b]); });
    var lo = ops[0], hi = ops[ops.length-1];
    if(rate(byOp[lo])<OK && rate(byOp[hi])-rate(byOp[lo])>=15){
      done["u:int"] = 1;
      var sl = splitLine("int");
      push({key:"op"+lo, tone:"base", unit:"int", soft:byOp[lo].n<SURE,
        title:"整数の "+OPNAME[lo]+"を 立て直す",
        obs:"整数の "+OPNAME[lo]+"が "+rate(byOp[lo])+"%（"+byOp[lo].ok+"/"+byOp[lo].n+"問）。"
          + "ほかの 計算は "+rate(byOp[hi])+"%。"+(sl ? sl.text : ""),
        why:"1つの 演算だけ 落ちる ときは、その 手つづきが まだ 身に ついて いません。"
          + "分数も 割合も 方程式も この上に のって いるので、先に ここを 通します。",
        todo:OPNAME[lo]+"だけの プリントを 20問。"
          + (sl ? sl.s+"を 中心に、" : "")+"3日 つづけて 8割を こえたら 次へ。",
        link:linkTo("int", byU.int && byU.int.g,
          "&o="+OPCODE[lo]+"&da=2&db=1&n=20"+(lo==="/" ? "&dm=rem" : "")),
        label:OPNAME[lo]+"だけ 出す"});
    }
  }

  /* 2) 手当てが 要る 単元を 一度に 見る。
        にがて（60%未満）か、型で はっきり 割れて いる ところ。
        ならべる 順は 土台の 単元が 先、つぎに 落ちて いる 順。 */
  var need = ids.filter(function(id){
    if(!ok(id)) return false;
    if(rate(byU[id])<BAD) return true;
    var sp = splitLine(id);
    return !!(sp && rate(sp.hard)<BAD);            /* 全体は ふつうでも 一部が 崩れて いる */
  }).sort(function(a,b){
    /* 土台の 単元が 先。土台どうしは 整数→小数→分数 の 順（前提の 順）。
       そのほかは 落ちて いる 順。 */
    var ia = BASIC.indexOf(a), ib = BASIC.indexOf(b);
    if(ia>=0 && ib>=0) return ia - ib;
    if(ia>=0) return -1;
    if(ib>=0) return 1;
    return rate(byU[a]) - rate(byU[b]);
  });

  /* どの 単元が どの 単元の 足を ひっぱって いるか（両方 崩れて いる ときだけ） */
  var blocks = {};
  need.forEach(function(id){
    var rc = root(id,0);
    if(rc) (blocks[rc] || (blocks[rc] = [])).push(id);
  });
  function upper(id){
    var b = (blocks[id]||[]).filter(function(y){ return !done["u:"+y] && y!==id; });
    b.forEach(function(y){ done["u:"+y] = 1; });
    if(!b.length) return null;
    return {ids:b,
      tail:"（"+b.map(nameOf).join("・")+"は そのあと）",
      why:b.map(nameOf).join("・")+"が "+b.map(function(y){ return rate(byU[y])+"%"; }).join("・")
        + "で 止まって いるのは、ここが ゆれて いるからです。"
        + "上を 先に やっても、どこで まちがえたのか 本人にも 分からなく なります。"
        + "遠回りに 見えて、こちらが 近道です。",
      todo:"8割を こえてから "+b.map(nameOf).join("・")+"に もどります。"};
  }

  need.forEach(function(id){
    if(done["u:"+id]) return;
    var sp = splitLine(id), up = upper(id), base = BASIC.indexOf(id)>=0;
    /* 2a) 型で はっきり 割れて いる → そこだけを 名ざす */
    if(sp){
      done["u:"+id] = 1;
      push({key:"split"+id, tone: base||up ? "base" : "weak", unit:id, soft:thin(id),
        title:nameOf(id)+" ― "+sp.s+"で 止まって いる"+(up ? up.tail : ""),
        obs:nameOf(id)+"は ぜんたいで "+rate(byU[id])+"%（"+byU[id].ok+"/"+byU[id].n+"問）。"+sp.text,
        why:(sp.clean
              ? "かんたんな 側が "+rate(sp.easy)+"% とれて いるので、単元 まるごとが"
                + " 分かって いない わけでは ありません。"
              : "")
          + "落ちて いるのは この ひと手間 だけです。単元を まるごと やり直すより、"
          + "ここを 取り出して やる ほうが 早く、本人も «何が できる ように なったか» が 分かります。"
          + (up ? " " + up.why : ""),
        todo:sp.s+"の 問題を "+nFor(id)+"問。"
          + (sp.url ? "リンクは その型だけを 出す ように して あります。"
                    : "できた ものに ○を つけて、型を 目で 見せると 効きます。")
          + " 8割を こえたら、ほかの 型と 混ぜて もう1枚。" + (up ? " " + up.todo : ""),
        link:sheetFor(id, sp), label:sp.s+"を 出す"});
      return;
    }
    /* 2b) 手前を まだ といて いない → まず そこを ためす */
    var nt = firstUntouched(id);
    if(nt && !up){
      done["u:"+id] = 1;
      push({key:"try"+nt, tone:"base", unit:nt, soft:thin(id),
        title:nameOf(nt)+"を 先に ためす",
        obs:nameOf(id)+"が "+rate(byU[id])+"%（"+byU[id].ok+"/"+byU[id].n+"問）。"
          + "落ち方は 型に よらず ばらけて います。"
          + "その 土台の "+nameOf(nt)+"は まだ 1問も といて いません。",
        why:"ここが できて いるかで、手当ての 場所が 変わります。"
          + "できて いれば "+nameOf(id)+"の やり方の 問題、できて いなければ 土台の 問題です。"
          + "分からない まま 数を こなすのが いちばん もったいない。",
        todo:nameOf(nt)+"を "+nFor(nt)+"問だけ ためして、結果で 決めます。",
        link:linkTo(nt, byU[id].g, "&n="+nFor(nt)), label:nameOf(nt)+"を ためす"});
      return;
    }
    /* 2c) 型でも 割れず、土台も とれて いる → 数を こなす 段階 */
    done["u:"+id] = 1;
    var r0 = rate(byU[id]);
    push({key:"weak"+id, tone: base||up ? "base" : (r0>=HIGH ? "care" : "weak"),
      unit:id, soft:thin(id),
      title:(r0>=HIGH ? nameOf(id)+"は あと 少し（見直しの ぶん）" : nameOf(id)+"を もう1枚")
        + (up ? up.tail : ""),
      obs:nameOf(id)+"が "+r0+"%（"+byU[id].ok+"/"+byU[id].n+"問）。"
        + "落ち方は 型に よらず ばらけて います。",
      why: (r0>=HIGH
        ? "型で 割れて いないので、やり方は 分かって います。落として いるのは 見直しで 拾える ぶんです。"
        : (base ? "ここは この先 ずっと つかう ところです。型で 割れて いないので、"
                + "やり方は 分かって いて 手が まだ 慣れて いない 段階です。"
                : "土台の 単元は とれて います。この単元の 手つづきを くり返すのが 効きます。"))
        + (up ? " " + up.why : ""),
      todo:(r0>=HIGH
        ? "数を 増やすより、1枚を 半分に して 見直しの 時間を とります。"
        : nameOf(id)+"を "+nFor(id)+"問。1回の 数を 半分に して、そのぶん ていねいに。")
        + (up ? " " + up.todo : ""),
      link:sheetFor(id, null), label:"もう1枚 つくる"});
  });

  /* 3) 後半で 落ちて いないか（理解では なく 集中・時間の 話）。
        これが 効いて いる ときは、単元の 正答率を「慣れて いない」と 読んでは いけない。 */
  var st = stamina(recs);
  if(st) push({key:"stamina", tone:"care", unit:null, soft:false,
    title:"後半で 落ちて いる",
    obs:"1枚の 前半 "+st.front+"%、後半 "+st.back+"%（同じ型どうしで くらべて "+st.n+"問）。"
      + "差が "+st.gap+"ポイント。",
    why:"前半と 後半で 同じ型の 問題を くらべて この差が つくのは、"
      + "やり方が 分からない ためでは ありません。集中が 切れる か、急いで いるか、"
      + "1枚が 長すぎる かの どれかです。正答率だけ 見て「にがて」と 決めると 見まちがえます。",
    todo:"問題の 数を 半分に して 2回に 分ける。"
      + "または 時間を 計って「早く」より「ぜんぶ 合う」を めあてに します。"});

  /* 4) 60〜70%の 土台単元。ほかに 言うことが 少なければ 拾う */
  if(out.length<2 && !st){
    BASIC.forEach(function(id){
      if(done["u:"+id] || !shaky(id)) return;
      var up = trend(R.seq[id]);
      if(up && up.to - up.from >= 20) return;              /* のびている 途中なら せかさない */
      done["u:"+id] = 1;
      var sp = splitLine(id);
      push({key:"basic"+id, tone:"base", unit:id, soft:thin(id),
        title: sp ? nameOf(id)+" ― "+sp.s+"が 弱い" : nameOf(id)+"を もう少し",
        obs:nameOf(id)+"が "+rate(byU[id])+"%（"+byU[id].ok+"/"+byU[id].n+"問）。"+(sp ? sp.text : ""),
        why:"あと ひと押しで 土台が かたまります。ここが 8割を こえると、"
          + "上の 単元の つまずきが はっきり 減ります。",
        todo:nameOf(id)+"を "+nFor(id)+"問。"+(sp ? sp.s+"を 多めに。" : ""),
        link:sheetFor(id, sp), label:"もう1枚 つくる"});
    });
  }

  /* 5) けたが 増えると 落ちる（プリントの 設定で くらべる） */
  ids.forEach(function(id){
    if(out.length>=6 || !ok(id) || done["u:"+id]) return;
    var w = wallOf(QS[id]||[]);
    if(!w) return;
    push({key:"wall"+id, tone:"weak", unit:id, soft:false,
      title:nameOf(id)+"は けたが 増えると 落ちる",
      obs:nameOf(id)+"は「"+w.easy+"」なら "+w.easyR+"%（"+w.easyN+"問）、"
        + "「"+w.hard+"」だと "+w.hardR+"%（"+w.hardN+"問）。",
      why:"やり方は 分かって います。落ちるのは けたが 増えて"
        + " 手順が 長く なる ところ。ここは 理解より 手の 慣れの 話です。",
      todo:"「"+w.easy+"」で 8割を たもったまま、けたを 1つ だけ 上げて 20問。"
        + "いきなり 難しい ほうへ 飛ばさない。",
      link:linkTo(id, byU[id].g, "&n="+nFor(id)), label:nameOf(id)+"を つくる"});
  });

  var weakCount = out.length;

  /* 6) のびている ところ */
  ids.forEach(function(id){
    if(done["u:"+id]) return;               /* 手当てを すすめた 単元を ほめると ちぐはぐに なる */
    var t = trend(R.seq[id]);
    if(t && t.to - t.from >= 20 && t.to >= OK)
      push({key:"up"+id, tone:"good", unit:id, soft:false,
        title:nameOf(id)+"は のびて います",
        obs:"はじめの ころ "+t.from+"% → さいきん "+t.to+"%。",
        why:"やり方が 手に 入った ところです。ここで 数を 増やすより、"
          + "少し 難しい ものを 混ぜる ほうが 伸びます。",
        todo:"今の ままで だいじょうぶ。手を ゆるめて、ほかの 単元に 時間を 回します。"});
  });

  /* 7) つまずきが 見あたらない ときだけ、まだの 単元を すすめる（基礎の 順に） */
  if(!weakCount && total>=12){
    var gs = {}; ids.forEach(function(id){ gs[byU[id].g] = 1; });
    var g = Object.keys(gs).map(Number).sort(function(a,b){return a-b;}).pop();
    var order = ["int","bignum","hole","dec","frac","dfmix","mixed","divisor","prime",
                 "unit","ratioc","hi","daihyo","letter","prop","neg","eq"];
    if(g){
      var rest = Object.keys(U).filter(function(id){ return U[id].g.indexOf(g)>=0 && !byU[id]; })
        .sort(function(a,b){
          var ia = order.indexOf(a), ib = order.indexOf(b);
          return (ia<0?99:ia) - (ib<0?99:ib);
        });
      if(rest.length) push({key:"rest", tone:"info", unit:rest[0], soft:false,
        title:"つぎは "+nameOf(rest[0])+"を ためす",
        obs:GRN[g]+"で まだ といて いない 単元が "+rest.length+" あります（"
          + rest.slice(0,3).map(nameOf).join("・")+(rest.length>3 ? " ほか" : "")+"）。",
        why:"いまの ところ 大きな つまずきは 見えません。"
          + "ひととおり 触って おくと、穴が あるか どうかが はっきりします。",
        todo:nameOf(rest[0])+"を "+nFor(rest[0])+"問。",
        link:linkTo(rest[0], g, "&n="+nFor(rest[0])), label:nameOf(rest[0])+"を ためす"});
    }
  }
  return {items:out, total:total, byOp:byOp, weak:weakCount, level:levelOf(recs)};
}


function analyse(records){
  var byUnit = {}, byGrade = {}, i, j;
  records.forEach(function(r){
    (r.perQ||[]).forEach(function(q){
      var key = q.unit + "@" + q.grade;
      var u = byUnit[key] || (byUnit[key] = {id:q.unit,
        ja:q.unitJa || (U[q.unit] && U[q.unit].ja) || q.unit, n:0, ok:0, g:q.grade});
      u.n++; if(q.ok) u.ok++;
      var g = byGrade[q.grade] || (byGrade[q.grade] = {n:0, ok:0, units:{}});
      g.n++; if(q.ok) g.ok++; g.units[q.unit] = 1;
    });
  });
  return {byUnit:byUnit, byGrade:byGrade};
}
function viewAna(){
  var s = store();
  if(!s.records.length) return '<div class="card"><div class="empty">まだ 記録が ありません。<br>'
    + '「さいてん」で 1枚 つけると、ここに 出ます。</div></div>';
  var kids = s.kids.slice();
  if(anaKid && kids.indexOf(anaKid)<0) anaKid = null;
  var recs = s.records.filter(function(r){ return !anaKid || r.kid===anaKid; });
  var h = "";
  if(kids.length>1){
    h += '<div class="card"><h2>だれの 分析？</h2><div class="chips" id="anakids">'
      + '<button type="button" data-ana="" aria-pressed="'+(!anaKid)+'">ぜんいん</button>';
    kids.forEach(function(k){
      h += '<button type="button" data-ana="'+esc(k)+'" aria-pressed="'+(anaKid===k)+'">'+esc(k)+'</button>';
    });
    h += '</div></div>';
  }
  if(!recs.length) return h+'<div class="card"><div class="empty">この人の 記録は まだ ありません。</div></div>';

  var tot = recs.reduce(function(a,r){ return a+r.total; },0);
  var ok  = recs.reduce(function(a,r){ return a+r.score; },0);
  var last = recs[recs.length-1];
  var ad = advise(recs), L = ad.level;

  /* --- 現在地（レベル） --- */
  h += '<div class="card"><h2>いまの 現在地 <em>'+esc(anaKid || (kids.length?kids[0]:"この人"))+'</em></h2>';
  if(tot < 12){
    h += '<div class="here thin"><b>まだ わかりません</b>'
      + '<span>あと '+(12-tot)+'問ほど（1枚ぶん）</span></div>'
      + '<p class="muted">学年の 通りぐあいを 出すには、その 学年で 12問（1枚ぶん）は 要ります。'
      + '1枚 つけると ここに 出ます。</p>';
  } else {
    var nowRow = L.now ? L.row(L.now) : null;
    h += '<div class="here '+(nowRow ? nowRow.st : "none")+'">'
      + '<b>'+(L.now ? GRN[L.now] : "—")+'</b>'
      + '<span>'+(!nowRow ? "" : nowRow.st==="none" ? "は これから"
                : nowRow.st==="thin" ? "を ためして いる ところ"
                : nowRow.st==="pass" ? "まで 通過" : "の とちゅう")+'</span></div>';
    h += '<p class="lead">'+esc(levelLine(L, tot))+'</p>';
    h += '<div class="ladder">';
    L.rows.slice().reverse().forEach(function(z){
      h += '<div class="lv '+z.st+(z.g===L.now?" now":"")+'">'
        + '<span class="g">'+GRN[z.g]+'</span>'
        + '<span class="stt">'+LVN[z.st]+'</span>'
        + '<span class="bar"><i style="width:'+(z.n?z.r:0)+'%"></i></span>'
        + '<span class="pc">'+(z.n ? z.r+'%' : '')+'</span>'
        + (z.n ? '<span class="sub">'+z.n+'問 ・ '+z.tried+'/'+z.all+'単元</span>' : '')
        + '</div>';
    });
    h += '</div>';
    /* まだ ためして いない ところが あると、判定は そこまで */
    var nr = nowRow && nowRow.rest ? nowRow.rest : [];
    if(nowRow && nowRow.st!=="none" && nr.length){
      h += '<p class="note">'+GRN[L.now]+'で まだ ためして いない 単元が '+nr.length+' あります（'
        + esc(nr.slice(0,4).map(nameOf).join("・")) + (nr.length>4 ? " ほか" : "")
        + '）。ここを ためすと 現在地が はっきりします。</p>';
    }
  }
  h += '<div class="tiles small">'
    + '<div class="tile"><b>'+pct(ok,tot)+'<span>点</span></b><span>ぜんぶの 平均</span></div>'
    + '<div class="tile"><b>'+recs.length+'</b><span>つけた プリント</span></div>'
    + '<div class="tile"><b>'+tot+'</b><span>といた 問題</span></div>'
    + '<div class="tile"><b>'+pct(last.score,last.total)+'<span>点</span></b><span>いちばん 新しい 1枚</span></div>'
    + '</div></div>';

  /* --- 見立て（基礎が 先） --- */
  h += '<div class="card"><h2>見立て <em>土台から 順に</em></h2>';
  if(ad.total < 12){
    h += '<p class="muted">まだ '+ad.total+'問です。この数では、どこで つまずいて いるかは 分かりません。'
      + 'あと '+(20-ad.total)+'問ほど（1〜2枚）とくと、型べつに 分けて 見られる ように なります。</p>'
      + '</div>';
  } else {
  if(ad.total < 24){
    h += '<p class="muted">ただし まだ '+ad.total+'問です。あと '+(24-ad.total)
      + '問ほど とくまでは、下の 見立ては 仮の ものと して 読んで ください。</p>';
  }
  if(ad.items.length){
    h += '<ol class="advice">';
    ad.items.slice(0,4).forEach(function(it){
      h += '<li class="'+it.tone+'"><b>'+esc(it.title)
         + (it.soft ? '<i class="soft">まだ 少ない ので めやす</i>' : '')+'</b>'
         + '<p class="obs"><span>見えたこと</span>'+esc(it.obs)+'</p>'
         + '<p class="why"><span>どう 読むか</span>'+esc(it.why)+'</p>'
         + '<p class="todo"><span>やること</span>'+esc(it.todo)+'</p>'
         + (it.link ? '<a href="'+it.link+'">'+esc(it.label)+'</a>' : '')+'</li>';
    });
    h += '</ol>';
  } else {
    h += '<p class="muted">いまのところ 大きな つまずきは 見えません。'
      + 'このまま いろいろな 単元を まぜて つづけて ください。</p>';
  }
  h += '<p class="note">見かた：'+MIN+'問いじょう といて '+OK+'%に とどかない ところを「土台が あやしい」、'
    + BAD+'%未満を「にがて」と しています。同じ 単元でも、くり上がりの ある/なし、'
    + '通分の 要る/要らない のように <b>型で 2つに 割って</b> くらべ、'
    + (GAP)+'ポイント以上 差が つく ところを「ここで 落ちている」と 言います。'
    + 'にがてな 単元が あっても、その 手前の 単元が 崩れていれば <b>手前を 先に</b> すすめます。</p></div>';
  }

  var a = analyse(recs), us = Object.keys(a.byUnit);
  var GN = {3:"小3",4:"小4",5:"小5",6:"小6",7:"中1",8:"中2"};
  /* --- 計算の 種類ごと --- */
  var ops = Object.keys(ad.byOp).filter(function(o){ return ad.byOp[o].n>=3; });
  if(ops.length){
    var ORD = ["+","-","*","/"];
    ops.sort(function(x,y){ return ORD.indexOf(x) - ORD.indexOf(y); });
    h += '<div class="card"><h2>計算の 種類ごと</h2><div class="bars">';
    ops.forEach(function(o){
      var x = ad.byOp[o], p = pct(x.ok,x.n);
      h += '<div class="bar"><div class="nm">'+OPNAME[o]+'</div>'
        + '<div class="vl">'+p+'%<small>'+x.ok+'/'+x.n+'問</small></div>'
        + '<div class="track"><div class="fill" style="width:'+p+'%"></div></div></div>';
    });
    h += '</div><p class="note">整数と 虫食い算の 問題だけで 数えています。'
      + '分数や 小数の × ÷ を まぜると、計算の 力と 単元の 理解が ごちゃまぜに なるためです。</p></div>';
  }
  /* 学年ごとの 出来ぐあいは 上の「いまの 現在地」で 出して いる */
  /* 単元は 出来ない順。5問以上 やって 60%未満を「にがて」と 呼ぶ */
  us.sort(function(x,y){ return pct(a.byUnit[x].ok,a.byUnit[x].n) - pct(a.byUnit[y].ok,a.byUnit[y].n); });
  h += '<div class="card"><h2>単元ごとの 出来ぐあい <em>できない 順</em></h2><div class="bars">';
  us.forEach(function(id){
    var x = a.byUnit[id], p = pct(x.ok,x.n), weak = x.n>=5 && p<60;
    h += '<div class="bar"><div class="nm"><i>'+(GN[x.g]||"")+'</i>'+esc(x.ja)
      + (weak?'<span class="tag">にがて</span>':'')+'</div>'
      + '<div class="vl">'+p+'%<small>'+x.ok+'/'+x.n+'問</small></div>'
      + '<div class="track"><div class="fill" style="width:'+p+'%"></div></div></div>';
  });
  h += '</div></div>';

  h += '<div class="card"><h2>さいきんの 点数</h2><div class="bars">';
  recs.slice(-10).reverse().forEach(function(r){
    var p = pct(r.score,r.total);
    h += '<div class="bar"><div class="nm">'+esc(r.title)+'<i style="margin-left:6px">'+fmtDate(r.at)+'</i></div>'
      + '<div class="vl">'+p+'点<small>'+r.score+'/'+r.total+'</small></div>'
      + '<div class="track"><div class="fill" style="width:'+p+'%"></div></div></div>';
  });
  return h+'</div></div>';
}

function draw(){
  var v = document.getElementById("view");
  v.innerHTML = tab==="mark" ? viewMark() : tab==="log" ? viewLog() : viewAna();
  [].forEach.call(document.querySelectorAll("#tabs button"),function(b){
    b.setAttribute("aria-pressed", b.dataset.v===tab ? "true":"false");
  });
  if(tab==="mark") refreshScore(); else document.getElementById("bottom").classList.add("hide");
  window.scrollTo(0,0);
}

document.addEventListener("DOMContentLoaded", function(){
  var gf = document.getElementById("gf"); if(gf) gf.media = "all";
  askPersist();
  takeHash();
  window.addEventListener("hashchange", function(){ if(takeHash()) draw(); });
  draw();

  document.getElementById("tabs").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    tab = b.dataset.v; qrMasu = null; qrNote = ""; draw();
  });

  document.getElementById("view").addEventListener("click", function(e){
    var b = e.target.closest("button"), a;
    if(!b) return;
    if(b.dataset.sheet!==undefined){
      var s = sheets().filter(function(x){ return x.id===b.dataset.sheet; })[0];
      if(s){ sel = s; marks = s.qs.map(function(){ return 1; }); photo = null; qrMasu = null; qrNote = ""; }
      draw(); return;
    }
    if(b.dataset.kid!==undefined){ kid = b.dataset.kid; draw(); return; }
    if(b.dataset.ana!==undefined){ anaKid = b.dataset.ana || null; draw(); return; }
    if(b.dataset.i!==undefined){
      var i = Number(b.dataset.i);
      marks[i] = marks[i]===1 ? 0 : 1;
      b.className = "mark "+(marks[i]===1?"ok":"ng");
      b.querySelector(".st").textContent = marks[i]===1 ? "○" : "✕";
      refreshScore(); return;
    }
    if(b.id==="delpic"){ photo = null; draw(); return; }
    if(b.id==="expjson"){ exportJSON(); draw(); return; }
    if(b.dataset.del!==undefined){
      if(!confirm("この記録を けしますか？")) return;
      var st = store();
      st.records = st.records.filter(function(r){ return r.id!==b.dataset.del; });
      saveStore(st); draw(); return;
    }
  });

  document.getElementById("view").addEventListener("input", function(e){
    if(e.target.id==="kidnew") kid = e.target.value.trim();
  });
  document.getElementById("view").addEventListener("change", function(e){
    if(e.target.id==="impjson"){
      var jf = e.target.files && e.target.files[0];
      if(!jf) return;
      var fr = new FileReader();
      fr.onload = function(){
        var r = importJSON(String(fr.result));
        if(r.err) alert(r.err);
        else if(!r.r && !r.s && !r.k) alert("新しい 記録は ありませんでした（すべて 入って います）。");
        else alert("読みこみました。記録 "+r.r+"件 / プリント "+r.s+"まい を 足しました。");
        draw();
      };
      fr.onerror = function(){ alert("ファイルを 読めませんでした。"); };
      fr.readAsText(jf);
      e.target.value = "";
      return;
    }
    if(e.target.id!=="pic") return;
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function(){
      var max = 900, sc = Math.min(1, max/Math.max(img.width,img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      try{ photo = c.toDataURL("image/jpeg",0.6); }catch(err){ photo = null; }
      draw();
    };
    img.onerror = function(){ URL.revokeObjectURL(url); };
    img.src = url;
  });

  document.getElementById("save").addEventListener("click", function(){
    if(!sel) return;
    var s = store();
    var name = kid.trim();
    if(name && s.kids.indexOf(name)<0) s.kids.push(name);
    var okN = marks.filter(function(m){ return m===1; }).length;
    s.records.push({
      id: "r"+Date.now(),
      sheetId: sel.id, at: new Date().toISOString(), kid: name,
      title: sel.title, score: okN, total: marks.length, prof: sel.prof||"",
      perQ: sel.qs.map(function(q,i){
        return {unit:q.unit, unitJa:q.unitJa, grade:q.grade, ok:marks[i]===1,
                op:q.op||"", kind:q.kind||"", tid:q.tid||"", sub:q.sub||q.tid||""};
      }),
      photo: photo || undefined
    });
    if(s.records.length>400) s.records = s.records.slice(-400);
    if(!saveStore(s)) alert("記録を 保存できませんでした（ブラウザの 空きが たりません）。");
    sel = null; marks = []; photo = null;
    tab = "log"; draw();
  });
});
})();
</script>
</body>
</html>
